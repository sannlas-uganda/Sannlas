<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Shop - Sannlas</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding-bottom:80px;color:#000}
.header{background:#000;color:#fff;padding:20px;text-align:center;position:relative;min-height:160px}
.header h1{color:#FFCC02;margin:8px 0;font-size:20px}
.shop-logo{width:90px;height:90px;border-radius:50%;border:3px solid #FFCC02;object-fit:cover;background:#fff;cursor:pointer;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px}
.stat-card{background:#fff!important;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1);color:#000!important}
.stat-card b{font-size:18px;display:block;color:#000!important}
.stat-card small{color:#666}
.card{background:#fff;border-radius:12px;margin:10px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);color:#000}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}
.pcard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative;color:#000}
.pcard img{width:100%;height:150px;object-fit:cover}
.btn{padding:8px 12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:3px;font-size:12px}
.badge{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.quick button{padding:14px;border-radius:12px;font-size:14px;border:none;font-weight:800}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center;padding:15px}
.modal-box{background:#fff;border-radius:15px;padding:15px;max-width:400px;width:100%;color:#000}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
</style></head><body>

<div class="header" id="shopHeader">
 <button onclick="location.href='/'" style="position:absolute;top:12px;left:12px;background:#FFCC02;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:900">🏠 Home</button>
 <img id="sLogo" class="shop-logo" src="https://via.placeholder.com/150" onclick="document.getElementById('logoInput').click()">
 <input type="file" id="logoInput" accept="image/*" hidden onchange="uploadLogo()">
 <div id="sName" style="color:#fff;margin-top:8px">Loading...</div>
 <div id="sInfo" style="font-size:13px;color:#aaa"></div>
 <div style="margin-top:8px"><span style="background:#FFCC02;color:#000;padding:3px 10px;border-radius:20px;font-size:11px" id="sVerified">⏳ Checking</span></div>
</div>

<div style="padding:10px 15px 0 15px;display:flex;justify-content:space-between;align-items:center;background:#f5f5f5"><h3 style="margin:0;color:#000">📊 Today's Business</h3><small id="todayDate" style="color:#666"></small></div>
<div class="stats">
 <div class="stat-card">👁️<b id="stViews">0</b><small>Views</small></div>
 <div class="stat-card">📦<b id="stProducts">0</b><small>Products</small></div>
 <div class="stat-card">📞<b id="stCalls">0</b><small>Call Clicks</small></div>
 <div class="stat-card">💬<b id="stWhats">0</b><small>WhatsApp</small></div>
 <div class="stat-card" style="border:2px solid #FFCC02">🪙<b id="stCoins">0</b><small>Coins</small></div>
</div>

<!-- FIXED: Closed the flex div properly -->
<div class="card">
 <div style="display:flex;justify-content:space-between;align-items:center">
  <h3 style="margin:0">🛍️ My Products</h3>
  <button onclick="location.href='/?open=sell'" style="background:#FF6A00;color:#fff;padding:8px 14px;border-radius:10px;font-weight:900;border:none">➕ Add FREE</button>
 </div>
 <div class="products" id="myProducts" style="margin-top:10px"></div>
 <button id="loadMoreBtn" onclick="loadMoreProducts()" style="display:none;background:#fff;border:2px solid #FF6A00;color:#FF6A00;width:100%;padding:14px;border-radius:12px;font-weight:900;margin-top:12px">⬇️ Load 10 More</button>
</div>

<div class="card">
 <h3 style="margin:0 0 10px 0">🔥 Orders / Wants For Me</h3>
 <div style="display:flex;gap:8px;margin-bottom:10px">
  <button id="tabOrders" onclick="showTab('orders')" class="btn" style="flex:1;background:#000;color:#FFCC02">My Sales Orders</button>
  <button id="tabWants" onclick="showTab('wants')" class="btn" style="flex:1;background:#eee">Matching Wants</button>
 </div>
 <div id="ordersBox"></div>
 <div id="wantsBox" style="display:none"></div>
</div>

<div class="card">
 <h3>⚙️ Shop Settings</h3>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
  <button class="btn" style="background:#000;color:#fff;width:100%" onclick="openSettings()">✏️ Edit Shop Info</button>
  <button class="btn" style="background:#fff;border:1px solid #ccc;width:100%" onclick="toggleHours()">🕒 Hours</button>
 </div>
 <div id="settingsPreview" style="font-size:13px;color:#555;margin-top:10px"></div>
</div>

<div class="card">
 <h3>⚡ Quick Actions</h3>
 <div class="quick">
  <button onclick="location.href='/?open=sell'" style="background:#FF6A00;color:#fff;width:100%">➕ Add Product FREE</button>
  <button onclick="shareShop()" style="background:#00AA00;color:#fff;width:100%">🔗 Share Link</button>
  <button onclick="viewAsBuyer()" style="background:#fff;border:2px solid #00AA00;color:#00AA00;width:100%">👁️ View as Buyer</button>
  <button onclick="location.href='/invite'" style="background:#fff;border:2px solid #FF6A00;color:#FF6A00;width:100%">🎁 Invite & Earn</button>
 </div>
</div>

<div class="modal" id="editPriceModal"><div class="modal-box">
 <h3>Edit Price</h3><input type="number" id="editPriceVal"><input type="hidden" id="editPriceId">
 <button onclick="savePrice()" style="width:100%;background:#000;color:#FFCC02;padding:12px;border-radius:10px">Save</button>
 <button onclick="closeModals()" style="width:100%;background:#eee;margin-top:6px">Cancel</button>
</div></div>
<div class="modal" id="editStockModal"><div class="modal-box">
 <h3>Edit Stock</h3><input type="number" id="editStockVal"><input type="hidden" id="editStockId">
 <button onclick="saveStock()" style="width:100%;background:#000;color:#FFCC02;padding:12px;border-radius:10px">Save</button>
 <button onclick="closeModals()" style="width:100%;background:#eee;margin-top:6px">Cancel</button>
</div></div>
<div class="modal" id="settingsModal"><div class="modal-box" style="max-height:80vh;overflow-y:auto">
 <h3>Shop Settings</h3>
 <label>Business Name</label><input id="setName">
 <label>Location</label><input id="setLocation">
 <label>Phone</label><input id="setPhone">
 <label>Delivery Info</label><input id="setDelivery">
 <label>Working Hours</label><input id="setHours">
 <label>Payment Methods</label><input id="setPayment">
 <label>Description</label><textarea id="setDesc"></textarea>
 <button onclick="saveSettings()" style="width:100%;background:#000;color:#FFCC02;padding:12px;border-radius:10px;margin-top:10px">💾 Save</button>
 <button onclick="closeModals()" style="width:100%;background:#eee;margin-top:6px">Cancel</button>
</div></div>

<script>
let myUser = JSON.parse(localStorage.getItem('sannlas_user')||localStorage.getItem('user')||'{}');
let myEmail = (myUser.email||'').toLowerCase();
let myShopSlug = '';
let currentPage = 1;
let hasMore = false;
document.getElementById('todayDate').innerText = new Date().toLocaleDateString();

async function loadMyShop(page=1){
 if(!myEmail){ alert('Login first!'); location.href='/'; return; }
 let r = await fetch('/api/my-shop?email='+encodeURIComponent(myEmail)+'&page='+page);
 let d = await r.json();
 if(!d.success ||!d.shop){
   document.getElementById('sName').innerHTML='<h2>No Shop Yet</h2><button onclick="location.href=\'/?open=sell\'" style="background:#FFCC02;padding:10px;border-radius:10px">Add First Product</button>';
   return;
 }
 let s = d.shop; myShopSlug = s.shop_slug||s.slug||'';
 document.getElementById('sLogo').src = s.logo||'https://via.placeholder.com/150?text='+encodeURIComponent((s.business_name||'SHOP').substring(0,3));
 document.getElementById('sName').innerHTML = `<h1>🏪 ${s.business_name||'My Shop'}</h1>`;
 document.getElementById('sInfo').innerHTML = `📍 ${s.location||'Uganda'} | 📞 ${s.phone||''}`;
 document.getElementById('sVerified').innerText = s.verified? '✅ Verified' : '⏳ Not Verified';
 document.getElementById('settingsPreview').innerHTML = `🚚 ${s.delivery_info||'Kampala'}<br>🕒 ${s.working_hours||''}<br>💳 ${s.payment||''}`;
 document.getElementById('setName').value=s.business_name||''; document.getElementById('setLocation').value=s.location||'';
 document.getElementById('setPhone').value=s.phone||''; document.getElementById('setDelivery').value=s.delivery_info||'';
 document.getElementById('setHours').value=s.working_hours||''; document.getElementById('setPayment').value=s.payment||''; document.getElementById('setDesc').value=s.description||'';

 if(page==1){
   document.getElementById('myProducts').innerHTML='';
   document.getElementById('stViews').innerText = d.stats.views||0;
   document.getElementById('stProducts').innerText = d.total||0;
   document.getElementById('stCalls').innerText = d.stats.call_clicks||0;
   document.getElementById('stWhats').innerText = d.stats.whatsapp_clicks||0;
   document.getElementById('stCoins').innerText = d.stats.coins||0;
 }

 let prods = d.products||[];
 if(prods.length==0 && page==1){ document.getElementById('myProducts').innerHTML='<p>No products yet — <a href="/?open=sell">Add Product FREE</a></p>'; }

 prods.forEach(p=>{
   document.getElementById('myProducts').innerHTML += `
    <div class="pcard">
     <span class="badge" style="background:${p.is_hidden?'#999':'#00AA00'};color:#fff">${p.is_hidden?'Hidden':'Visible'}</span>
     <img src="${p.image}">
     <div style="padding:8px"><b style="font-size:13px">${p.name}</b><br><span style="color:#FF6A00;font-weight:bold">UGX ${p.price}</span><br><small>Stock: ${p.stock||0}</small>
     <div style="display:flex;flex-wrap:wrap;margin-top:6px">
      <button class="btn" style="background:#000;color:#FFCC02" onclick="openEditPrice('${p.id}',${p.price})">✏️ Price</button>
      <button class="btn" style="background:#fff;border:1px solid #000" onclick="openEditStock('${p.id}',${p.stock||0})">📦 Stock</button>
      <button class="btn" style="background:#fff;border:1px solid red;color:red" onclick="deleteProd('${p.id}')">🗑️</button>
      <button class="btn" style="background:${p.is_hidden?'#00AA00':'#999'};color:#fff" onclick="toggleHide('${p.id}',${!p.is_hidden})">${p.is_hidden?'👁️':'🙈'}</button>
     </div></div></div>`;
 });

 hasMore = d.has_more;
 currentPage = d.page;
 document.getElementById('loadMoreBtn').style.display = hasMore? 'block' : 'none';
}

function loadMoreProducts(){ loadMyShop(currentPage+1); }
function showTab(t){
 document.getElementById('ordersBox').style.display = t=='orders'? 'block':'none';
 document.getElementById('wantsBox').style.display = t=='wants'? 'block':'none';
}
function openEditPrice(id,price){ document.getElementById('editPriceId').value=id; document.getElementById('editPriceVal').value=price; document.getElementById('editPriceModal').style.display='flex'; }
function openEditStock(id,stock){ document.getElementById('editStockId').value=id; document.getElementById('editStockVal').value=stock; document.getElementById('editStockModal').style.display='flex'; }
function openSettings(){ document.getElementById('settingsModal').style.display='flex'; }
function closeModals(){ document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); }
async function savePrice(){
 let id=document.getElementById('editPriceId').value; let price=parseInt(document.getElementById('editPriceVal').value);
 let r=await fetch('/api/my-shop/update-price',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,price,email:myEmail})});
 let d=await r.json(); if(d.success){ closeModals(); loadMyShop(1); } else alert(d.message);
}
async function saveStock(){
 let id=document.getElementById('editStockId').value; let stock=parseInt(document.getElementById('editStockVal').value);
 let r=await fetch('/api/my-shop/update-stock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,stock,email:myEmail})});
 let d=await r.json(); if(d.success){ closeModals(); loadMyShop(1); } else alert(d.message);
}
async function deleteProd(id){ if(!confirm('Delete?')) return; let r=await fetch('/api/my-shop/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,email:myEmail})}); if((await r.json()).success) loadMyShop(1); }
async function toggleHide(id,hide){ let r=await fetch('/api/my-shop/toggle-hide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,hidden:hide,email:myEmail})}); if((await r.json()).success) loadMyShop(1); }
async function uploadLogo(){
 let file=document.getElementById('logoInput').files[0]; if(!file) return; let fd=new FormData(); fd.append('logo',file); fd.append('email',myEmail); fd.append('shop_slug',myShopSlug);
 let r=await fetch('/api/shop/upload-logo',{method:'POST',body:fd}); if((await r.json()).success) loadMyShop(1);
}
async function saveSettings(){
 let payload={email:myEmail,business_name:document.getElementById('setName').value,location:document.getElementById('setLocation').value,phone:document.getElementById('setPhone').value,delivery_info:document.getElementById('setDelivery').value,working_hours:document.getElementById('setHours').value,payment:document.getElementById('setPayment').value,description:document.getElementById('setDesc').value};
 let r=await fetch('/api/my-shop/update-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); if((await r.json()).success){ closeModals(); loadMyShop(1); }
}
function shareShop(){ let url=location.origin+'/shop/'+myShopSlug; navigator.clipboard.writeText(url); alert('Link copied: '+url); }
function viewAsBuyer(){ location.href='/shop/'+myShopSlug; }

loadMyShop(1);
</script></body></html>
