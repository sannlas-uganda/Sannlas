<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIKES - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f1f5f9;padding-bottom:80px}
.navbar{background:#000;color:#FFCC02;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.tab-bar{background:#fff;display:flex;border-bottom:2px solid #eee;position:sticky;top:50px;z-index:9}
.tab-bar button{flex:1;padding:14px;border:none;background:#fff;font-weight:900;cursor:pointer;border-bottom:3px solid transparent}
.tab-bar button.active{border-bottom-color:#FF0000;background:#fff0f0}
.product-card{background:#fff;border-radius:14px;overflow:hidden;margin:8px 10px;display:flex;gap:10px;padding:10px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.product-card img{width:80px;height:80px;object-fit:cover;border-radius:10px}
.like-btn{padding:6px 12px;border-radius:20px;border:none;font-weight:900;cursor:pointer;margin-top:6px}
.btn-liked{background:#FF0000;color:#fff}
.btn-like{background:#eee;color:#333}
.stats{background:#000;color:#FFCC02;padding:12px;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:20px}
</style>
</head>
<body>
<div class="navbar"><a href="/" style="color:#FFCC02;text-decoration:none;font-weight:bold">← SANNLAS</a><b>❤️ LIKES</b><span></span></div>
<div class="stats"><div><b id="totalLikes">0</b><small>Total Likes Given</small></div><div><b id="totalLiked">0</b><small>Products Liked</small></div><div><b id="totalStars">0</b><small>Stars Received</small></div></div>
<div class="tab-bar"><button id="tab-liked" class="active" onclick="switchTab('liked')">Liked Products</button><button id="tab-received" onclick="switchTab('received')">Likes Received</button><button id="tab-discover" onclick="switchTab('discover')">Discover</button></div>
<div id="likesList"><p style="text-align:center;padding:30px">⏳ Loading...</p></div>

<script>
let currentUser=JSON.parse(localStorage.getItem('sannlas_user')||'{}');
let currentTab='liked';
let allData={liked:[], received:[], discover:[]};

function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab-bar button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+tab).classList.add('active');renderList();}

async function loadLikes(){
 let email=currentUser.email||''; let phone=currentUser.phone||'';
 try{
  let r=await fetch(`/api/likes/stats?email=${encodeURIComponent(email)}&phone=${encodeURIComponent(phone)}`);
  let d=await r.json();
  document.getElementById('totalLikes').innerText=d.total_given||0;
  document.getElementById('totalLiked').innerText=(d.liked_list||[]).length;
  document.getElementById('totalStars').innerText=d.total_received||0;
  allData.liked=d.liked_list||[];
  allData.received=d.received_list||[];
  allData.discover=d.discover||[];
  renderList();
 }catch(e){document.getElementById('likesList').innerHTML='<p style="color:red;text-align:center">Error: '+e.message+'</p>';}
}

function renderList(){
 let list=allData[currentTab]||[];
 if(list.length==0){document.getElementById('likesList').innerHTML=`<p style="text-align:center;padding:30px;color:#666">No ${currentTab} yet<br><small>${currentTab=='liked'?'Like products to see them here!':''}</small></p>`;return;}
 document.getElementById('likesList').innerHTML=list.map(p=>{
  let isLiked = currentTab!=='received' ? true : false;
  let btn = currentTab=='discover' ? (p.is_liked?`<button class="like-btn btn-liked" onclick="unlikeProduct('${p.id}')">❤️ Liked</button>`:`<button class="like-btn btn-like" onclick="likeProduct('${p.id}')">🤍 Like</button>`) : `<button class="like-btn btn-liked" onclick="unlikeProduct('${p.id}')">❤️ ${p.likes||0} Likes</button>`;
  return `<div class="product-card"><img src="${p.image||'https://via.placeholder.com/80'}" onclick="location.href='/sell/${p.id}'"><div><b>${(p.name||'').slice(0,30)}</b><br><small>${p.business||p.location||''} • UGX ${Number(p.price||0).toLocaleString()}</small><br>${btn}</div></div>`;
 }).join('');
}

async function likeProduct(productId){
 if(!currentUser.email){alert('Login first!');return;}
 let r=await fetch('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentUser.email,phone:currentUser.phone,product_id:productId})});
 let d=await r.json();
 if(d.success){ loadLikes(); } else alert(d.message);
}

async function unlikeProduct(productId){
 if(!currentUser.email){alert('Login first!');return;}
 let r=await fetch('/api/unlike',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentUser.email,phone:currentUser.phone,product_id:productId})});
 let d=await r.json();
 if(d.success){ loadLikes(); } else alert(d.message);
}

loadLikes();
</script>
</body>
</html>
