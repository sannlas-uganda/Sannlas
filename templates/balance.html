<!DOCTYPE html>
<html>
<head>
<title>My Balance - SANNLAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#c0392b;padding-bottom:80px}
.navbar{background:#000;color:white;padding:12px;display:flex;justify-content:space-between}
.btn{padding:10px 15px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;margin:3px}
.btn-yellow{background:#FFCC02;color:#000}.btn-green{background:#2e7d32;color:white}
.card{background:white;margin:12px;border-radius:15px;padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#000;color:#FFCC02;padding:15px;border-radius:12px;text-align:center;border:2px solid #FFCC02}
.box.green{background:#2e7d32;color:white;border:none}
</style>
</head>
<body>
<div class="navbar"><b onclick="location.href='/'">🛍️ SANNLAS</b><div><button class="btn" style="background:white;color:black" onclick="location.href='/'">🏠 Home</button><button class="btn btn-yellow" onclick="location.href='/wallet'">🪙 Wallet</button></div></div>

<div class="card" style="background:#000;color:#FFCC02;text-align:center;border:3px solid #FFCC02">
<h2>💰 MY BALANCE</h2>
<p style="font-size:11px;margin:5px 0">MoMo: 0795712326 | 1 coin = 599 UGX</p>
<div class="grid" style="margin-top:10px">
<div class="box"><div>🪙 Coins</div><div style="font-size:28px;font-weight:bold" id="coinsBal">0</div><div style="font-size:10px">Can upload <span id="upCount">0</span></div></div>
<div class="box green"><div>💵 Sales UGX</div><div style="font-size:22px;font-weight:bold" id="salesBal">0</div><div style="font-size:10px" id="ordersBal">0 orders</div></div>
</div>
<div style="margin-top:10px;background:#FFCC02;color:#000;padding:8px;border-radius:10px;font-size:11px">Email: <span id="myEmail">-</span></div>
</div>

<div class="card">
<h3>📦 Sales Summary</h3>
<div id="salesList">Loading...</div>
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="requestWithdraw()">💸 Request Withdraw - MoMo 0795712326</button>
<div style="font-size:10px;text-align:center;margin-top:8px;color:gray">Withdraws processed by Admin. Minimum 10,000 UGX</div>
</div>

<div class="card">
<h3>🪙 Coin Usage</h3>
<div id="coinUsage">You spend 3 coins per product upload. Each coin = 599 UGX.</div>
</div>

<script>
let currentUser=null;
function loadUser(){let s=localStorage.getItem('sannlas_user');if(!s){alert('Login first');location.href='/';return;} currentUser=JSON.parse(s); document.getElementById('myEmail').innerText=currentUser.email; loadAll();}
function loadAll(){
fetch(`/api/coins/balance?email=${encodeURIComponent(currentUser.email)}&phone=${encodeURIComponent(currentUser.phone)}`).then(r=>r.json()).then(d=>{document.getElementById('coinsBal').innerText=d.coins||0; document.getElementById('upCount').innerText=Math.floor((d.coins||0)/3);});
fetch(`/api/seller/sales?phone=${encodeURIComponent(currentUser.phone)}&email=${encodeURIComponent(currentUser.email)}&period=all`).then(r=>r.json()).then(d=>{document.getElementById('salesBal').innerText=(d.total_sales||0).toLocaleString(); document.getElementById('ordersBal').innerText=(d.total_orders||0)+' orders'; document.getElementById('salesList').innerHTML=(d.orders||[]).slice(0,10).map(o=>`<div style="border-bottom:1px solid #eee;padding:6px 0;font-size:11px">📦 ${o.id||'Order'} - UGX ${Number(o.total||o.my_total||0).toLocaleString()} - ${o.status||'Packed'}</div>`).join('')||'No sales yet';});
}
function requestWithdraw(){let amt=prompt('How much UGX to withdraw? Minimum 10,000'); if(!amt) return; fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:currentUser.business,email:currentUser.email,phone:currentUser.phone,message:`WITHDRAW REQUEST: UGX ${amt} - MoMo ${currentUser.phone} - From ${currentUser.email}`})}).then(()=>alert('✅ Withdraw request sent to Admin 0795712326 - Will send MoMo!')); }
loadUser();
</script>
</body>
</html>
