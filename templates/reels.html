<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REELS - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
#reels-container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{position:relative;height:100vh;scroll-snap-align:start;background:#000;display:flex;align-items:center;justify-content:center}
.reel video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:15px 15px 30px 15px;background:linear-gradient(transparent,rgba(0,0,0,0.9));z-index:5}
.shop-name{color:#FFCC02;font-weight:900;font-size:14px;text-decoration:none;display:block}
.shop-name:hover{text-decoration:underline}
.product-title{color:#fff;font-weight:bold;font-size:15px;display:block;margin:5px 0;text-decoration:none}
.product-desc{color:#fff;font-size:12px;opacity:0.8}
.action-col{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.promote-btn{background:#FFCC02;color:#000;padding:12px 20px;border-radius:25px;font-weight:900;border:3px solid #000;display:block;text-align:center;text-decoration:none;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
.shop-btn{background:#000;color:#00FF88;padding:12px 20px;border-radius:25px;font-weight:900;border:2px solid #00FF88;font-size:14px;cursor:pointer}
.right-actions{position:absolute;right:10px;bottom:150px;display:flex;flex-direction:column;gap:15px;z-index:6}
.action-btn{background:rgba(0,0,0,0.5);border:none;color:#fff;font-size:22px;padding:10px;border-radius:50%;width:50px;height:50px}
.volume-btn{position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.6);border:none;color:#fff;padding:8px 12px;border-radius:20px;z-index:6}
.unmute-hint{position:absolute;top:15px;left:15px;background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:10px;font-size:12px;z-index:6}
.username-link{color:#fff;font-size:10px;opacity:0.6;text-decoration:none}
.username-link:hover{opacity:1;color:#FFCC02}
</style>
</head>
<body>
<div id="reels-container"></div>
<script>
let reels=[];let observer;
async function loadReels(){
 const r=await fetch('/api/sannlas/reels/feed'); reels=await r.json();
 const c=document.getElementById('reels-container');
 
 // Check if URL has ?play=ID to open specific reel
 const urlParams = new URLSearchParams(window.location.search);
 const playId = urlParams.get('play');
 if(playId){
   reels = reels.sort((a,b)=> (b.id==playId) - (a.id==playId));
 }

 c.innerHTML=reels.map((reel,i)=>`
 <div class="reel" data-id="${reel.id}">
  <video src="${reel.video_url}" loop playsinline muted ${i==0?'autoplay':''}></video>
  <button class="volume-btn" onclick="toggleVolume(this)">🔇</button>
  <div class="unmute-hint">Tap 🔊 for sound</div>
  <div class="right-actions">
    <button class="action-btn" onclick="likeReel(${reel.id}, this)">❤️<br><span style="font-size:10px">${reel.likes||0}</span></button>
    <button class="action-btn">💬</button>
    <button class="action-btn">↗️</button>
  </div>
  <div class="overlay">
    <a class="shop-name" href="/@/${(reel.shop_slug||'shop')}">🏪 @${(reel.shop_name||'SHOP').toUpperCase()} ➔</a>
    <a class="product-title" href="/shop/${(reel.shop_slug||'shop')}?product=${reel.product_id||''}">${reel.product_name||reel.caption||'New Collection'}</a>
    <div class="product-desc">${(reel.description||'').slice(0,80)}</div>
    <div class="action-col">
      <a href="${reel.promote_link||'/shop/'+(reel.shop_slug||'shop')}" class="promote-btn">💰 PROMOTE & EARN UGX ${Number(reel.earn_amount||reel.promo_commission_ugx||1797).toLocaleString()}</a>
      <button class="shop-btn" onclick="location.href='${reel.product_link||'/shop/'+(reel.shop_slug||'shop')}'">UGX ${Number(reel.price||24000).toLocaleString()} - BUY NOW</button>
    </div>
    <div style="font-size:10px;opacity:0.6;margin-top:8px;color:#fff"><a class="username-link" href="/@/${(reel.shop_slug||'shop')}">@${(reel.user_name||'user').split('@')[0]} • ${reel.location||'Uganda'} ➔ View Profile</a></div>
  </div>
 </div>`).join('');
 observeVideos(); addVideoClickHandlers();
}
function observeVideos(){
 const videos=document.querySelectorAll('video');
 observer=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
   if(e.isIntersecting){e.target.play().catch(()=>{});}else{e.target.pause();}
  });
 },{threshold:0.7});
 videos.forEach(v=>observer.observe(v));
}
function addVideoClickHandlers(){
 document.querySelectorAll('.reel video').forEach(v=>v.addEventListener('click',function(){this.muted=!this.muted;document.querySelectorAll('.volume-btn').forEach(b=>b.innerText=this.muted?'🔇':'🔊');}));
}
function toggleVolume(btn){
 const video=btn.parentElement.querySelector('video');
 video.muted=!video.muted;
 btn.innerText=video.muted?'🔇':'🔊';
}
async function likeReel(id,btn){
 await fetch('/api/sannlas/reels/like/'+id,{method:'POST'});
 let span=btn.querySelector('span');if(span){span.innerText=parseInt(span.innerText||0)+1;}
}
loadReels();
</script>
</body>
</html>
