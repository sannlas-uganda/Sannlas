<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reels - Sannlas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;overflow:hidden;font-family:system-ui}
#reels-container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100vh;scroll-snap-align:start;position:relative;background:black}
.reel video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:15px 95px 15px 15px;background:linear-gradient(transparent,rgba(0,0,0,.9));color:white}
.right-actions{position:absolute;right:10px;bottom:140px;display:flex;flex-direction:column;gap:20px; z-index:20;}
.action-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:none;color:white; flex-direction:column;}
.header{position:fixed;top:0;left:0;right:0;z-index:99;padding:12px;display:flex;justify-content:space-between}
.header a{background:rgba(0,0,0,.5);color:#FFCC02;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:900}
.shop-name{color:#FFCC02;font-weight:900;font-size:16px; display:flex; align-items:center; gap:6px; margin-bottom:4px;}
.product-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:3px;line-height:1.2;text-shadow:1px 1px 2px #000;}
.product-desc{font-size:13px;color:#ddd;margin-bottom:5px;line-height:1.3; opacity:0.9;}
.promo-link{font-size:12px;margin-bottom:8px;}
.promo-link a{color:#00e5ff; text-decoration:underline; background:rgba(0,0,0,0.4); padding:3px 8px; border-radius:8px; word-break:break-all;}
.shop-btn{background:#00ff88;color:#000;padding:11px 20px;border-radius:30px;font-weight:900;border:none;display:inline-block;text-decoration:none;font-size:14px;box-shadow:0 2px 10px rgba(0,255,136,0.5)}
.volume-btn{position:absolute; top:60px; right:15px; width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,0.6); border:none; color:white; font-size:22px; cursor:pointer; z-index:30;}
.unmute-hint{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:white; padding:10px 16px; border-radius:25px; font-size:14px; z-index:25; pointer-events:none; animation:fadeOut 3s forwards; animation-delay:2s;}
@keyframes fadeOut{to{opacity:0}}
</style></head><body>
<div class="header"><a href="/">← Home</a><a href="/">SANNLAS</a></div>
<div id="reels-container"></div>
<script>
let reels=[]; let current=0;
async function loadReels(){
 const r=await fetch('/api/sannlas/reels/feed'); reels=await r.json();
 const c=document.getElementById('reels-container');
 c.innerHTML=reels.map((reel,i)=>`
 <div class="reel" data-id="${reel.id}">
  <video src="${reel.video_url}" loop playsinline muted ${i==0?'autoplay':''}></video>
  <button class="volume-btn" onclick="toggleVolume(this)">🔇</button>
  <div class="unmute-hint">Tap 🔊 for sound</div>
  <div class="right-actions">
    <button class="action-btn" onclick="like(${reel.id}, this)">❤️<br><span style="font-size:10px">${reel.likes||0}</span></button>
    <button class="action-btn">💬</button>
    <button class="action-btn">↗️</button>
  </div>
  
  <!-- 👇👇👇 YOUR ORDER - EXACT AS YOU SAID - SHOP NAME, TITLE, DESC, PROMO, BUY NOW 👇👇👇 -->
  <div class="overlay">
    
    <!-- 1. SHOP NAME -->
    <a class="shop-name" href="/shop/${(reel.shop_slug||'shop').toLowerCase().replace(/\\s+/g,'-').replace(/[^a-z0-9-]/g,'')}?product=${reel.product_id||''}&highlight=${reel.product_id||''}" style="text-decoration:none;">
      🏪 @${(reel.shop_name||reel.user_name||'SHOP').toUpperCase()}
    </a>

    <!-- 2. PRODUCT TITLE -->
    <div class="product-title">
      ${reel.product_name||reel.caption||'New Collection'}
    </div>

    <!-- 3. PRODUCT DESCRIPTION -->
    <div class="product-desc">
      ${reel.description||''}
      ${reel.hashtags?`<br><span style="color:#FFCC02">${reel.hashtags}</span>`:''}
    </div>

    <!-- 4. PROMOTION LINK -->
    ${reel.promo_link?`<div class="promo-link"><a href="${reel.promo_link}" target="_blank">🔗 ${reel.promo_link}</a></div>`:''}

    <!-- 5. BUY NOW -->
    ${reel.buy_link?`<a class="shop-btn" href="${reel.buy_link}">🛒 UGX ${Number(reel.price||0).toLocaleString()} - BUY NOW</a>`:''}

    <div style="font-size:10px;opacity:0.6;margin-top:6px">@${(reel.user_name||reel.user_email||'user').split('@')[0]} • ${reel.location||'Uganda'}</div>
  </div>
  <!-- 👆👆👆 END YOUR ORDER 👆👆👆 -->

 </div>`).join('');
 observeVideos();
 addVideoClickHandlers();
}

function toggleVolume(btn){
  const reel = btn.closest('.reel');
  const video = reel.querySelector('video');
  const hint = reel.querySelector('.unmute-hint');
  video.muted = !video.muted;
  if(video.muted){ btn.innerHTML = '🔇'; } 
  else { btn.innerHTML = '🔊'; video.volume = 1; video.play().catch(()=>{}); if(hint) hint.style.display = 'none'; }
}

function addVideoClickHandlers(){
  document.querySelectorAll('.reel video').forEach(video => {
    video.addEventListener('click', () => {
      const reel = video.closest('.reel');
      const btn = reel.querySelector('.volume-btn');
      const hint = reel.querySelector('.unmute-hint');
      if(video.muted){ video.muted = false; video.volume = 1; btn.innerHTML = '🔊'; video.play().catch(()=>{}); if(hint) hint.style.display = 'none'; } 
      else { video.paused ? video.play() : video.pause(); }
    });
  });
}

function observeVideos(){
 const vids=document.querySelectorAll('video');
 const io=new IntersectionObserver(es=>{
   es.forEach(e=>{ if(e.isIntersecting){ e.target.play().catch(()=>{}); } else { e.target.pause(); } });
 },{threshold:0.7});
 vids.forEach(v=>io.observe(v));
}

async function like(id, btn){ 
  try{ await fetch('/api/sannlas/reels/like/'+id,{method:'POST'}); btn.innerHTML='❤️<br><span style="font-size:10px">+1</span>'; } catch(e){}
}
loadReels();
</script></body></html>
