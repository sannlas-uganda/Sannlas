<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reels - Sannlas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;overflow:hidden;font-family:system-ui}
#reels-container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100vh;scroll-snap-align:start;position:relative;background:black}
.reel video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:white}
.right-actions{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:20px}
.action-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;border:none;color:white}
.header{position:fixed;top:0;left:0;right:0;z-index:99;padding:12px;display:flex;justify-content:space-between}
.header a{background:rgba(0,0,0,.5);color:#FFCC02;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:900}
.caption{font-size:14px;margin-top:8px}
.shop-btn{background:#FF6600;color:white;padding:10px 18px;border-radius:20px;font-weight:900;border:none;margin-top:10px;display:inline-block;text-decoration:none}
</style></head><body>
<div class="header"><a href="/">← Home</a><a href="/">SANNLAS</a></div>
<div id="reels-container"></div>
<script>
let reels=[]; let current=0;
async function loadReels(){
 const r=await fetch('/api/sannlas/reels/feed'); reels=await r.json();
 const c=document.getElementById('reels-container');
 c.innerHTML=reels.map((reel,i)=>`
 <div class="reel" data-id="${reel.id}">
  <video src="${reel.video_url}" loop playsinline ${i==0?'autoplay':''} onclick="this.paused?this.play():this.pause()"></video>
  <div class="right-actions">
    <button class="action-btn" onclick="like(${reel.id}, this)">❤️<br><span style="font-size:10px">${reel.likes}</span></button>
    <button class="action-btn">💬</button>
    <button class="action-btn">↗️</button>
  </div>
  <div class="overlay">
    <b>@${(reel.user_name||reel.user_email).split('@')[0]}</b>
    <div class="caption">${reel.caption}</div>
    ${reel.product_link?`<a class="shop-btn" href="${reel.product_link}">🛒 Shop Now</a>`:''}
  </div>
 </div>`).join('');
 observeVideos();
}
function observeVideos(){
 const vids=document.querySelectorAll('video');
 const io=new IntersectionObserver(es=>{
   es.forEach(e=>{
     if(e.isIntersecting){ e.target.play().catch(()=>{}); }
     else e.target.pause();
   });
 },{threshold:0.7});
 vids.forEach(v=>io.observe(v));
}
async function like(id, btn){ await fetch('/api/sannlas/reels/like/'+id,{method:'POST'}); btn.innerHTML='❤️<br><span style="font-size:10px">+1</span>'; }
loadReels();
</script></body></html>
