<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title><style>body{font-family:Arial;background:#c0392b;margin:0}.header{background:#000;color:#fff;padding:20px;text-align:center}.header h1{color:#FFCC02}button{padding:10px 18px;border:none;border-radius:20px;margin:5px;font-weight:bold;cursor:pointer}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}.card{background:#fff;border-radius:12px;overflow:hidden}.card img{width:100%;height:170px;object-fit:cover}</style></head><body>
<div class="header" id="h">Loading...</div><div class="products" id="p"></div>
<script>
let slug = (location.pathname.split('/shop/')[1] || new URLSearchParams(location.search).get('slug') || '').trim();
slug = decodeURIComponent(slug).split('?')[0].split('/')[0];

async function load(){
 try{
  let r = await fetch('/api/shop/'+slug);
  let d = await r.json();
  let shop = d.shop;
  let products = d.products || [];

  // FALLBACK if shop not in shops.json but products exist
  if((!r.ok ||!shop) && products.length==0){
    let r2 = await fetch('/api/products?shop='+slug);
    products = await r2.json();
    if(products.length>0){
      let s = products[0];
      shop = {business_name: s.business||'Shop', location: s.location||'Uganda', phone: s.phone||'', description: 'Welcome to '+(s.business||'Shop')+' shop!'};
    }
  }
  if(!shop){
    document.getElementById('h').innerHTML=`<h1>Shop Not Found</h1><p>Slug: ${slug}</p><p>Products found: ${products.length}</p><button onclick="location.href='/'">🏠 Home</button>`;
    return;
  }
  let count = products.length || shop.total_products || shop.product_count || 0;
  document.getElementById('h').innerHTML=`<h1>🏪 ${shop.business_name||shop.name}</h1><p>📍 ${shop.location||'Uganda'} | 📞 ${shop.phone||''}</p><p>${shop.description||''}</p><p>📦 ${count} Products (Exact)</p><button style="background:#25D366;color:#fff" onclick="window.open('https://wa.me/${(shop.phone||'').replace(/[^0-9]/g,'')}')">💬 WhatsApp</button><button style="background:#FFCC02" onclick="navigator.clipboard.writeText(location.href);alert('Link copied: '+location.href)">🔗 Share Shop</button><button onclick="location.href='/'">🏠 Home</button>`;
  if(products.length==0){
    document.getElementById('p').innerHTML=`<div style="grid-column:1/-1;background:#fff;padding:20px;border-radius:12px;text-align:center"><h3>No products yet</h3><p>This shop has ${count} products in database but none matched slug ${slug}</p></div>`;
  } else {
    document.getElementById('p').innerHTML=products.map(x=>`<div class="card"><img src="${x.image}"><div style="padding:8px"><b>${x.name}</b><br>UGX ${x.price}<br><button onclick="location.href='/?q='+encodeURIComponent(x.name)" style="width:100%;background:#000;color:#FFCC02;padding:6px;border:none;border-radius:8px">View</button></div></div>`).join('');
  }
 }catch(e){
  console.log(e);
  document.getElementById('h').innerHTML=`<h1>Error loading shop</h1><p>${e.message}</p><p>Slug: ${slug}</p><button onclick="location.href='/'">Home</button>`;
 }
}
load();
</script></body></html>
