<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title><style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#000;color:#fff;padding:20px;text-align:center}
.header h1{color:#FFCC02;margin:10px 0 5px 0}
.shop-logo{width:90px;height:90px;border-radius:50%;border:3px solid #FFCC02;object-fit:cover;background:#fff}
button{padding:10px 18px;border:none;border-radius:20px;margin:5px;font-weight:bold;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:170px;object-fit:cover}
.discount-badge{position:absolute;top:8px;left:8px;background:red;color:#fff;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:bold}
.shop-footer{background:#fff;margin:10px;border-radius:15px;padding:15px}
#buyerChatModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:99999;flex-direction:column}
</style></head><body>

<div class="header" id="h">
  <img id="shopLogoTop" class="shop-logo" src="https://via.placeholder.com/150?text=SHOP" style="display:none">
  <div id="headerText">Loading...</div>
</div>

<div class="products" id="p"></div>

<!-- KEEP CHAT MODAL - FOR SELLERS WITHOUT WHATSAPP -->
<div id="buyerChatModal">
  <div style="background:#075E54;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center">
    <span>💬 Chat with <span id="buyerChatShopName">Seller</span> <small style="font-size:11px">(1 coin unlock)</small></span>
    <button onclick="closeBuyerChat()" style="background:red;color:#fff;border:none;padding:8px 12px;border-radius:8px">✕</button>
  </div>
  <div id="buyerChatMessages" style="flex:1;overflow-y:auto;padding:15px;background:#e5ddd5;display:flex;flex-direction:column;gap:8px"></div>
  <div style="background:#f0f0f0;padding:10px;display:flex;gap:8px">
    <input id="buyerChatInput" placeholder="Type message..." style="flex:1;padding:12px;border-radius:20px;border:1px solid #ccc">
    <button onclick="sendBuyerMessage()" style="background:#25D366;color:#fff;border:none;padding:12px 18px;border-radius:20px;font-weight:bold">Send</button>
  </div>
</div>

<div class="shop-footer" id="shopFooter" style="display:none">
  <h3>🏪 About This Shop</h3>
  <div id="footerAbout"></div>
</div>

<script>
let slug = (location.pathname.split('/shop/')[1] || new URLSearchParams(location.search).get('slug') || '').trim();
slug = decodeURIComponent(slug).split('?')[0].split('/')[0];
let currentShop=null;
let buyerUser = JSON.parse(localStorage.getItem('sannlas_user')||localStorage.getItem('user')||'{}');
let buyerEmail = (buyerUser.email||'').toLowerCase();

async function load(){
 try{
  // SHOW LOADING
  document.getElementById('headerText').innerHTML = `<h1>🏪 Loading ${slug}...</h1><p style="color:#FFCC02">Please wait...</p>`;

  let r = await fetch('/api/shop/'+encodeURIComponent(slug));
  let d = await r.json();

  console.log("Shop API response:", d, "Status:", r.status);

  // IF API FAILS - SHOW ERROR INSTEAD OF INFINITE LOADING
  if(!r.ok){
    throw new Error(d.message || `Shop ${slug} not found (Status ${r.status})`);
  }

  let shop = d.shop;
  let products = d.products || [];

  if((!shop) && products.length==0){
    // fallback try products
    let r2 = await fetch('/api/products?shop='+encodeURIComponent(slug));
    products = await r2.json();
    if(products.length>0){
      let s = products[0];
      shop = {business_name: s.business||'Shop', location: s.location||'Uganda', phone: s.phone||'', description: 'Welcome!', shop_slug: slug, logo: '', created_at: Date.now()/1000};
    }
  }

  if(!shop){
    document.getElementById('headerText').innerHTML=`<h1>❌ Shop Not Found</h1><p>Slug: ${slug}</p><button onclick="location.reload()" style="background:#FFCC02;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold">Retry</button><br><br><a href="/" style="color:#FFCC02">← Back Home</a>`;
    return;
  }

  currentShop=shop;
  document.getElementById('shopLogoTop').src=shop.logo||`https://via.placeholder.com/150?text=${encodeURIComponent(shop.business_name||'SHOP')}`;
  document.getElementById('shopLogoTop').style.display='inline-block';

  document.getElementById('headerText').innerHTML=`<h1>🏪 ${shop.business_name||shop.name||shop.shop_slug}</h1><p>📍 ${shop.location||'Uganda'} | 📞 ${shop.phone||''}</p><p style="color:#FFCC02;font-size:13px">${shop.description||'Quality products!'}</p><div style="margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:5px"><button style="background:#25D366;color:#fff" onclick="openBuyerWhatsApp()">💬 WhatsApp • 1 Coin</button><button style="background:#000;color:#FFCC02;border:2px solid #FFCC02" onclick="openBuyerChat()">💬 Chat • 1 Coin</button><button style="background:#FFCC02;color:#000" onclick="openBuyerCall()">📞 Call • 1 Coin</button><button style="background:#fff;color:#000" onclick="shareShop()">🔗 Share Shop</button></div><p style="font-size:11px;color:#0f0;margin-top:8px">✅ Shop is FREE to open - Pay only when you contact seller!</p>`;

  // RENDER PRODUCTS - THIS WAS MISSING!
  let pDiv = document.getElementById('p');
  if(products.length===0){
    pDiv.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:12px">No products in this shop yet</div>`;
  } else {
    pDiv.innerHTML = products.map(prod=>{
      let img = prod.image || prod.images?.[0] || 'https://via.placeholder.com/300';
      let title = prod.title || prod.name || 'Product';
      let price = prod.price || prod.selling_price || 0;
      return `<div class="card"><div style="position:relative"><img src="${img}" loading="lazy"><span class="discount-badge">${prod.discount||''}</span></div><div style="padding:10px"><div style="font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div><div style="color:green;font-weight:bold">UGX ${price}</div></div></div>`;
    }).join('');
  }

  document.getElementById('shopFooter').style.display='block';
  document.getElementById('footerAbout').innerHTML = `<p>${shop.description||''}</p><p>📍 ${shop.location||''}</p>`;

 } catch(err){
   console.error("LOAD ERROR:", err);
   document.getElementById('headerText').innerHTML = `<h1>❌ Error Loading Shop</h1><p style="color:red">${err.message}</p><p>Slug: ${slug}</p><button onclick="location.reload()" style="background:#FFCC02;color:#000;padding:12px 20px;border-radius:20px;font-weight:bold;margin-top:10px">🔄 Retry</button><br><br><a href="/" style="color:#FFCC02">← Back Home</a>`;
 }
}

function shareShop(){ navigator.clipboard.writeText(location.href); alert('🔗 Copied!'); }

async function openBuyerWhatsApp(){
  if(!buyerEmail){ alert('Login first Boss!'); location.href='/?open=login'; return; }
  let phone = (currentShop.phone||'').toString().replace(/[^0-9]/g,'');
  if(phone.startsWith('0')) phone='256'+phone.slice(1);
  if(!phone.startsWith('256')) phone='256'+phone;
  try{
    let chk = await fetch(`/api/chat/check-unlock?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}&type=whatsapp`);
    let d = await chk.json();
    if(!d.unlocked){
      if(!confirm(`🔓 WhatsApp costs 1 coin (599 UGX)?`)) return;
      let r = await fetch('/api/chat/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,type:'whatsapp'})});
      let res = await r.json();
      if(!res.success){ alert(res.error); location.href='/balance'; return; }
    }
  }catch(e){}
  window.open(`https://wa.me/${phone}?text=Hi, I saw ${currentShop.business_name} on Sannlas`, '_blank');
}

async function openBuyerChat(){
  if(!buyerEmail){ alert('Login first!'); return; }
  try{
    let chk = await fetch(`/api/chat/check-unlock?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}&type=chat`);
    let d = await chk.json();
    if(!d.unlocked){
      if(!confirm(`🔓 In-App Chat costs 1 coin (599 UGX)?`)) return;
      let r = await fetch('/api/chat/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,type:'chat'})});
      let res = await r.json();
      if(!res.success){ alert(res.error); location.href='/balance'; return; }
    }
  }catch(e){}
  document.getElementById('buyerChatShopName').innerText = currentShop.business_name;
  document.getElementById('buyerChatModal').style.display='flex';
  loadBuyerMessages();
}

async function openBuyerCall(){
  if(!buyerEmail){ alert('Login first!'); return; }
  try{
    let chk = await fetch(`/api/chat/check-unlock?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}&type=call`);
    let d = await chk.json();
    if(!d.unlocked){
      if(!confirm(`🔓 Call costs 1 coin (599 UGX)?`)) return;
      let r = await fetch('/api/chat/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,type:'call'})});
      let res = await r.json();
      if(!res.success){ alert(res.error); location.href='/balance'; return; }
    }
  }catch(e){}
  window.location.href='tel:'+currentShop.phone;
}
function closeBuyerChat(){ document.getElementById('buyerChatModal').style.display='none'; }
async function loadBuyerMessages(){
  let r = await fetch(`/api/chat/history?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}`);
  let msgs = await r.json();
  document.getElementById('buyerChatMessages').innerHTML = msgs.length? msgs.map(m=>{
    let isMe = m.sender==='buyer';
    let style = isMe? 'align-self:flex-end;background:#dcf8c6' : 'align-self:flex-start;background:#fff';
    if(m.sender==='admin') return `<div style="align-self:center;background:#FFF3CD;border:2px solid #FFCC02;padding:10px;border-radius:12px;text-align:center">🛡️ ADMIN: ${m.text}</div>`;
    return `<div style="${style};padding:10px;border-radius:10px;max-width:70%">${m.text}<br><small style="color:#888">${new Date(m.time*1000).toLocaleTimeString()}</small></div>`;
  }).join('') : '<div style="text-align:center;color:#777;margin-top:30px">No messages yet. Say hi! (Works even if seller has no WhatsApp)</div>';
  document.getElementById('buyerChatMessages').scrollTop=99999;
}
async function sendBuyerMessage(){
  let text = document.getElementById('buyerChatInput').value.trim(); if(!text) return;
  await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,sender:'buyer',text})});
  document.getElementById('buyerChatInput').value=''; loadBuyerMessages();
}
setInterval(()=>{ let m=document.getElementById('buyerChatModal'); if(m && m.style.display==='flex') loadBuyerMessages(); },3000);
load();
</script></body></html>
