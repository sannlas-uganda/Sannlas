<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title><style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#000;color:#fff;padding:20px;text-align:center}
.header h1{color:#FFCC02;margin:10px 0 5px 0}
.shop-logo{width:90px;height:90px;border-radius:50%;border:3px solid #FFCC02;object-fit:cover;background:#fff}
button{padding:10px 18px;border:none;border-radius:20px;margin:5px;font-weight:bold;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);transition:all 0.3s}
.card.highlighted{border:3px solid #FFCC02 !important;box-shadow:0 0 25px #FFCC02 !important;transform:scale(1.05)}
.card img{width:100%;height:170px;object-fit:cover}
.discount-badge{position:absolute;top:8px;left:8px;background:red;color:#fff;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:bold}
.shop-footer{background:#fff;margin:10px;border-radius:15px;padding:15px}
#buyerChatModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:99999;flex-direction:column}
.highlight-banner{display:none;background:#FFCC02;color:#000;padding:10px;text-align:center;font-weight:900;position:sticky;top:48px;z-index:9998}
.shop-profile-header{background:#fff;padding:16px;border-bottom:1px solid #eee}
.profile-top{display:flex;gap:14px;align-items:center}
.avatar-box{width:86px;height:86px;border-radius:50%;border:3px solid #FFCC02;background:#fff;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.avatar-box img{width:100%;height:100%;object-fit:cover}
.stats-row{flex:1;display:flex;justify-content:space-around;text-align:center}
.stat b{display:block;font-size:17px;color:#111;line-height:1}
.stat span{font-size:10px;color:#666;font-weight:700;letter-spacing:0.5px;margin-top:3px;display:block}
.shop-name{font-weight:900;font-size:18px;margin-top:12px}
.shop-bio{font-size:12px;color:#666;margin:4px 0;line-height:1.4}
.action-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.avatar-wrap{position:relative;width:86px;height:86px;cursor:pointer;flex-shrink:0}
.avatar-wrap:active{transform:scale(0.95)}
.follow-tick{position:absolute;bottom:0px;right:0px;width:26px;height:26px;background:#00C853;color:#fff;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:900;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);z-index:5}
.follow-tick.show{display:flex}
</style></head><body>

<div id="topNav" style="background:#000;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9999">
  <a href="/" style="color:#FFCC02;text-decoration:none;font-weight:900;font-size:14px">← Back to Home</a>
  <span style="color:#FFCC02;font-weight:900;letter-spacing:1px">SANNLAS</span>
</div>
<div id="highlightBanner" class="highlight-banner">✨ Highlighting product from Reel ✨</div>

<div class="shop-profile-header" id="h">
  <div class="profile-top">
    <div class="avatar-wrap" onclick="goToReelsProfile()">
      <div class="avatar-box" id="shopAvatarBox">S</div>
      <div class="follow-tick" id="followTick">✓</div>
    </div>
    <div class="stats-row">
      <div class="stat"><b id="statFollowing">0</b><span>Following</span></div>
      <div class="stat"><b id="statFollowers">0</b><span>Followers</span></div>
      <div class="stat"><b id="statLikes">0</b><span>Likes</span></div>
      <div class="stat"><b id="statViews">0</b><span>Views</span></div>
    </div>
  </div>
  <div id="headerText">
    <div class="shop-name" id="shopNameBig">Loading...</div>
    <div class="shop-bio" id="shopBioText">Loading shop...</div>
    <div class="action-row" id="shopActions"></div>
  </div>
</div>

<div class="products" id="p"></div>

<div id="buyerChatModal">
  <div style="background:#075E54;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center">
    <span>💬 Chat with <span id="buyerChatShopName">Seller</span> <small style="font-size:11px">(1 coin unlock)</small></span>
    <button onclick="closeBuyerChat()" style="background:red;color:#fff;border:none;padding:8px 12px;border-radius:8px">✕</button>
  </div>
  <div id="buyerChatMessages" style="flex:1;overflow-y:auto;padding:15px;background:#e5ddd5;display:flex;flex-direction:column;gap:8px"></div>
  <div style="background:#f0f0f0;padding:10px;display:flex;gap:8px">
    <input id="buyerChatInput" placeholder="Type message..." style="flex:1;padding:12px;border-radius:20px;border:1px solid #ccc">
    <button onclick="sendBuyerMessage()" style="background:#25D366;color:#fff;border:none;padding:12px 18px;border-radius:20px;font-weight:bold">Send</button>
  </div>
</div>

<div class="shop-footer" id="shopFooter" style="display:none">
  <h3>🏪 About This Shop</h3>
  <div id="footerAbout"></div>
</div>

<script>
function cleanSlug(s){return (s||'shop').toString().trim().toLowerCase().replace(/%20|%2520|%20%20/gi,'-').replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||'shop';}
let raw_slug=(location.pathname.split('/shop/')[1]||new URLSearchParams(location.search).get('slug')||'').trim();raw_slug=decodeURIComponent(raw_slug).split('?')[0].split('/')[0];let slug=cleanSlug(raw_slug);let originalSlug=raw_slug;let currentShop=null;let buyerUser=JSON.parse(localStorage.getItem('sannlas_user')||localStorage.getItem('user')||'{}');let buyerEmail=(buyerUser.email||'').toLowerCase();
let shopOwnerEmail=''; let isFollowingShop=false;
history.pushState(null,'',location.href);window.addEventListener('popstate',function(){location.href='/';});

function goToReelsProfile(){
  let target = slug || cleanSlug(currentShop?.shop_slug || currentShop?.business_name || originalSlug);
  window.location.href = '/@/' + target;
}

// ===== INSTANT OPEN: Show cached shop in 0ms, no waiting =====
function renderShopInstant(shop, products){
  currentShop = shop;
  shopOwnerEmail = (shop.owner_email || shop.email || '').toLowerCase();
  let avatarBox=document.getElementById('shopAvatarBox');
  if(shop.logo){avatarBox.innerHTML=`<img src="${shop.logo}">`;}else{avatarBox.innerText=(shop.business_name||'S')[0].toUpperCase();}
  document.getElementById('shopNameBig').innerText=`🏪 ${shop.business_name}`;
  document.getElementById('shopBioText').innerHTML=`📍 ${shop.location||'Uganda'} | 📞 ${shop.phone||''}<br>${shop.description||'Quality products!'}<br><span style="color:#FF6A00;font-weight:800">${products.length} Products • Kampala</span>`;
  // Show buttons INSTANTLY - don't wait for follow check
  document.getElementById('shopActions').innerHTML=`
<div style="margin-top:10px;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px">
  <button id="followShopBtn" style="background:#FFCC02;color:#000;padding:10px 18px;border-radius:20px;border:2px solid #000" onclick="toggleFollowShop()">+ FOLLOW</button>
  <button style="background:#25D366;color:#fff;padding:10px 14px;border-radius:20px" onclick="openBuyerWhatsApp()">💬 WhatsApp • 1 Coin</button>
  <button style="background:#000;color:#FFCC02;border:2px solid #FFCC02;padding:10px 14px;border-radius:20px" onclick="openBuyerChat()">💬 Chat • 1 Coin</button>
  <button style="background:#FFCC02;color:#000;padding:10px 14px;border-radius:20px" onclick="openBuyerCall()">📞 Call • 1 Coin</button>
  <button style="background:#fff;color:#000;border:2px solid #000;padding:10px 14px;border-radius:20px" onclick="shareShop()">🔗 Share</button>
</div>
<div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center">
  <a href="/@/${cleanSlug(shop.shop_slug||slug)}" style="color:#000;background:#FFCC02;text-decoration:none;font-weight:900;padding:12px 20px;border-radius:25px;font-size:14px;box-shadow:0 2px 8px rgba(255,204,2,0.3)">🎬 View Reels Profile</a>
  <a href="/my-shop" style="color:#FFCC02;background:#1a1a1a;text-decoration:none;font-weight:900;padding:12px 20px;border-radius:25px;font-size:14px;border:2px solid #FFCC02;box-shadow:0 2px 8px rgba(0,0,0,0.3)">🏪 My Shop</a>
</div>
<p style="font-size:11px;color:#0a0;margin-top:8px">✅ Shop is FREE to open - Pay only when you contact seller!</p>`;
  // Products instantly
  let pEl=document.getElementById('p');
  if(products.length){pEl.innerHTML=products.map(prod=>{let pid=prod.id||prod._id||'';return `<div class="card" id="product-${pid}" data-id="${pid}"><div style="position:relative"><img src="${prod.image||''}" loading="lazy"><div class="discount-badge">${prod.discount||''}</div></div><div style="padding:8px"><b>${prod.title||prod.name||'Product'}</b><br><small>UGX ${prod.price||''}</small><br><button style="background:#000;color:#FFCC02;width:100%;margin-top:6px" onclick="location.href='/product/${pid}'">View Product</button></div></div>`}).join('');}
  // Restore follow tick instantly from cache if we have it
  try{ let cachedFollow = sessionStorage.getItem('sannlas_follow_'+slug); if(cachedFollow==='1'){ isFollowingShop=true; updateFollowBtn(); } }catch(e){}
  // Highlight if coming from Reel
  const params=new URLSearchParams(window.location.search);const highlightId=params.get('product')||params.get('highlight');
  if(highlightId){setTimeout(()=>{const el=document.getElementById('product-'+highlightId)||document.querySelector(`[data-id="${highlightId}"]`);if(el){document.getElementById('highlightBanner').style.display='block';document.getElementById('highlightBanner').innerHTML=`🎥 From Reel → ✨ ${products.find(p=>(p.id||p._id)==highlightId)?.title||'Product'} ✨`;el.classList.add('highlighted');el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{el.classList.remove('highlighted');},5000);}},800);}
}

async function loadShopFollowStats(){
  try{
    let r = await fetch('/api/user/follow-count/' + encodeURIComponent(slug));
    let s = await r.json();
    document.getElementById('statFollowers').innerText = (s.followers||0).toLocaleString();
    document.getElementById('statFollowing').innerText = (s.following||0).toLocaleString();
    if(s.email) shopOwnerEmail = s.email.toLowerCase();
  }catch(e){}
}

async function checkFollowStatus(){
  if(!buyerEmail || !shopOwnerEmail) return;
  if(buyerEmail === shopOwnerEmail){
    let b=document.getElementById('followShopBtn'); if(b){ b.innerText='YOU'; b.style.background='#eee'; b.style.color='#999'; b.disabled=true; }
    return;
  }
  try{
    let r=await fetch(`/api/follow/check?email=${encodeURIComponent(buyerEmail)}&target=${encodeURIComponent(shopOwnerEmail)}`);
    let d=await r.json();
    isFollowingShop = d.is_following;
    try{ sessionStorage.setItem('sannlas_follow_'+slug, isFollowingShop?'1':'0'); }catch(e){}
    updateFollowBtn();
  }catch(e){}
}

function updateFollowBtn(){
  let btn=document.getElementById('followShopBtn');
  if(btn){
    if(isFollowingShop){ btn.innerText='✓ FOLLOWING'; btn.style.background='#000'; btn.style.color='#fff'; btn.style.border='2px solid #000'; }
    else{ btn.innerText='+ FOLLOW'; btn.style.background='#FFCC02'; btn.style.color='#000'; btn.style.border='2px solid #000'; }
  }
  let tick=document.getElementById('followTick');
  if(tick){ if(isFollowingShop) tick.classList.add('show'); else tick.classList.remove('show'); }
}

async function toggleFollowShop(){
  if(!buyerEmail){ alert('Login first Boss!'); location.href='/?open=login'; return; }
  if(!shopOwnerEmail){ alert('Shop email not ready, wait 1 sec'); return; }
  let btn=document.getElementById('followShopBtn');
  let url = isFollowingShop ? '/api/unfollow' : '/api/follow';
  let original = btn.innerText;
  btn.innerText='...';
  try{
    let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:buyerEmail, phone:buyerUser.phone||'', target_email:shopOwnerEmail, target_shop:slug})});
    let j=await r.json();
    if(!r.ok || !j.success){ alert(j.message); btn.innerText=original; return; }
    let fEl=document.getElementById('statFollowers');
    let cur=parseInt((fEl.innerText||'0').toString().replace(/,/g,''))||0;
    if(isFollowingShop){ fEl.innerText=Math.max(0, cur-1).toLocaleString(); isFollowingShop=false; }
    else{ fEl.innerText=(cur+1).toLocaleString(); isFollowingShop=true; }
    try{ sessionStorage.setItem('sannlas_follow_'+slug, isFollowingShop?'1':'0'); }catch(e){}
    updateFollowBtn();
  }catch(e){ btn.innerText=original; alert(e.message); }
}

async function load(){
  // 1. INSTANT: Show cache in 0ms - don't wait for network!
  try{
    let cached = sessionStorage.getItem('sannlas_shop_'+slug) || sessionStorage.getItem('sannlas_shop_'+originalSlug);
    if(cached){ let c=JSON.parse(cached); if(c.shop) renderShopInstant(c.shop, c.products||[]); }
  }catch(e){}
  // 2. BACKGROUND: Fetch fresh data in parallel (not one-by-one)
  try{
    let r = await fetch('/api/shop/'+encodeURIComponent(slug));
    let d = await r.json();
    let shop = d.shop; let products = d.products||[];
    if(!shop && products.length>0){ let s=products[0]; shop={business_name:s.business||'Shop',location:s.location||'Uganda',phone:s.phone||'',description:'Welcome!',shop_slug:slug,logo:'',created_at:Date.now()/1000}; }
    if(!shop){
      // Fallback only if first fetch failed
      let r2=await fetch('/api/products?shop='+encodeURIComponent(slug)); let prods=await r2.json();
      if(prods.length>0){ products=prods; let s=products[0]; shop={business_name:s.business||'Shop',location:s.location||'Uganda',phone:s.phone||'',description:'Welcome!',shop_slug:slug,logo:'',created_at:Date.now()/1000}; }
    }
    if(!shop){ if(!currentShop) document.getElementById('shopNameBig').innerHTML=`<h1>Shop Not Found: ${raw_slug}</h1>`; return; }
    // Save for next instant open
    try{ sessionStorage.setItem('sannlas_shop_'+slug, JSON.stringify({shop, products})); }catch(e){}
    renderShopInstant(shop, products);
    // Load stats + follow IN PARALLEL in background - don't block UI
    loadShopFollowStats();
    checkFollowStatus();
    fetch('/api/shop/'+encodeURIComponent(slug)+'/stats').then(r=>r.json()).then(s=>{ document.getElementById('statLikes').innerText=(s.total_likes||s.likes||0).toLocaleString(); document.getElementById('statViews').innerText=(s.total_views||s.views||0).toLocaleString(); }).catch(()=>{ document.getElementById('statLikes').innerText=products.length*5; document.getElementById('statViews').innerText=products.length*120; });
  }catch(e){ if(!currentShop){ document.getElementById('shopNameBig').innerHTML='<h1>Error loading shop</h1><p>'+e+'</p>'; } console.error(e); }
}
function shareShop(){navigator.clipboard.writeText(location.href);alert('🔗 Copied!');}
async function openBuyerWhatsApp(){
  if(!buyerEmail){alert('Login first Boss!');location.href='/?open=login';return;}
  let phone=(currentShop.phone||'').toString().replace(/[^0-9]/g,'');if(phone.startsWith('0'))phone='256'+phone.slice(1);if(!phone.startsWith('256'))phone='256'+phone;
  try{let chk=await fetch(`/api/chat/check-unlock?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}&type=whatsapp`);let d=await chk.json();if(!d.unlocked){if(!confirm(`🔓 WhatsApp costs 1 coin (599 UGX)?`))return;let r=await fetch('/api/chat/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,type:'whatsapp'})});let res=await r.json();if(!res.success){alert(res.error);location.href='/balance';return;}}}catch(e){}
  window.open(`https://wa.me/${phone}?text=Hi, I saw ${currentShop.business_name} on Sannlas`, '_blank');
}
async function openBuyerChat(){
  if(!buyerEmail){alert('Login first!');return;}
  try{let chk=await fetch(`/api/chat/check-unlock?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}&type=chat`);let d=await chk.json();if(!d.unlocked){if(!confirm(`🔓 In-App Chat costs 1 coin (599 UGX)?`))return;let r=await fetch('/api/chat/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,type:'chat'})});let res=await r.json();if(!res.success){alert(res.error);location.href='/balance';return;}}}catch(e){}
  document.getElementById('buyerChatShopName').innerText=currentShop.business_name;document.getElementById('buyerChatModal').style.display='flex';loadBuyerMessages();
}
async function openBuyerCall(){
  if(!buyerEmail){alert('Login first!');return;}
  try{let chk=await fetch(`/api/chat/check-unlock?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}&type=call`);let d=await chk.json();if(!d.unlocked){if(!confirm(`🔓 Call costs 1 coin (599 UGX)?`))return;let r=await fetch('/api/chat/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,type:'call'})});let res=await r.json();if(!res.success){alert(res.error);location.href='/balance';return;}}}catch(e){}
  window.location.href='tel:'+currentShop.phone;
}
function closeBuyerChat(){document.getElementById('buyerChatModal').style.display='none';}
async function loadBuyerMessages(){let r=await fetch(`/api/chat/history?buyer=${encodeURIComponent(buyerEmail)}&shop=${encodeURIComponent(slug)}`);let msgs=await r.json();document.getElementById('buyerChatMessages').innerHTML=msgs.length?msgs.map(m=>{let isMe=m.sender==='buyer';let style=isMe?'align-self:flex-end;background:#dcf8c6':'align-self:flex-start;background:#fff';if(m.sender==='admin')return `<div style="align-self:center;background:#FFF3CD;border:2px solid #FFCC02;padding:10px;border-radius:12px;text-align:center">🛡️ ADMIN: ${m.text}</div>`;return `<div style="${style};padding:10px;border-radius:10px;max-width:70%">${m.text}<br><small style="color:#888">${new Date(m.time*1000).toLocaleTimeString()}</small></div>`;}).join(''):'<div style="text-align:center;color:#777;margin-top:30px">No messages yet. Say hi!</div>';document.getElementById('buyerChatMessages').scrollTop=99999;}
async function sendBuyerMessage(){let text=document.getElementById('buyerChatInput').value.trim();if(!text)return;await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:buyerEmail,shop_slug:slug,sender:'buyer',text})});document.getElementById('buyerChatInput').value='';loadBuyerMessages();}
setInterval(()=>{let m=document.getElementById('buyerChatModal');if(m&&m.style.display==='flex')loadBuyerMessages();},3000);
load();
</script></body></html>
