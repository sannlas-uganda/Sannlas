<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MESSAGES - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#f1f5f9;height:100vh;display:flex;flex-direction:column}
.navbar{background:#000;color:#FFCC02;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.threads{width:100%;max-width:400px;background:#fff;border-right:1px solid #ddd;overflow-y:auto;flex:1}
.thread{padding:12px;border-bottom:1px solid #eee;display:flex;gap:10px;cursor:pointer;align-items:center}
.thread:hover{background:#fffde7}
.thread.active{background:#FFCC02}
.avatar{width:45px;height:45px;border-radius:50%;background:#000;color:#FFCC02;display:flex;align-items:center;justify-content:center;font-weight:900}
.chat-area{flex:1;display:flex;flex-direction:column;background:#e5ddd5}
.chat-header{background:#075e54;color:#fff;padding:12px;display:flex;align-items:center;gap:10px}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.3}
.msg-buyer{align-self:flex-end;background:#dcf8c6;border-bottom-right-radius:2px}
.msg-seller{align-self:flex-start;background:#fff;border-bottom-left-radius:2px}
.input-bar{background:#f0f0f0;padding:8px;display:flex;gap:8px;align-items:center}
.input-bar input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
.input-bar button{background:#25D366;color:#fff;border:none;padding:10px 16px;border-radius:50%;cursor:pointer;font-weight:900}
.unlock-box{background:#fff;margin:10px;border-radius:12px;padding:20px;text-align:center;border:2px solid #FFCC02}
.hidden{display:none}
@media(min-width:700px){.container{flex-direction:row;display:flex;flex:1} .threads{max-width:350px} }
@media(max-width:699px){.threads.hidden-mobile{display:none} .chat-area.hidden-mobile{display:none} .chat-area{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20}}
</style>
</head>
<body>
<div class="navbar"><a href="/" style="color:#FFCC02;text-decoration:none;font-weight:bold">← SANNLAS</a><b>💬 MESSAGES</b><span id="coinBal" style="background:#FFCC02;color:#000;padding:4px 8px;border-radius:10px;font-size:12px">0 coins</span></div>

<div class="container" style="display:flex;flex:1;overflow:hidden">
<div id="threadsPanel" class="threads">
<div style="padding:8px"><input id="searchThread" placeholder="Search chats..." oninput="filterThreads()" style="width:100%;padding:10px;border-radius:20px;border:1px solid #ddd"></div>
<div id="threadsList"><p style="text-align:center;padding:20px;color:#666">⏳ Loading threads...</p></div>
</div>

<div id="chatPanel" class="chat-area hidden-mobile">
<div id="chatHeader" class="chat-header hidden"><div class="avatar" id="chatAvatar">S</div><div><b id="chatName">Shop</b><br><small id="chatStatus">Tap to view shop</small></div><button onclick="closeChat()" style="margin-left:auto;background:none;border:none;color:#fff;font-size:20px">✕</button></div>

<div id="unlockBox" class="unlock-box hidden">
<h3>🔒 Unlock Chat - 1 Coin</h3><p style="color:#666;margin:8px 0">Pay 1 coin to chat with this shop forever!</p>
<button onclick="unlockChat()" style="background:#000;color:#FFCC02;padding:12px 20px;border-radius:20px;border:none;font-weight:900;cursor:pointer">🔓 Unlock for 1 Coin</button>
<p id="unlockStatus" style="margin-top:8px;font-weight:bold"></p>
</div>

<div id="messagesList" class="messages"></div>

<div id="inputBar" class="input-bar hidden">
<input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>

<div id="noChatSelected" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#666">
<p style="font-size:50px">💬</p><p>Select a chat to start messaging</p><small>Your messages are private and secure</small>
</div>
</div>
</div>

<script>
let currentUser=JSON.parse(localStorage.getItem('sannlas_user')||'{}');
let currentShop=null; let currentBuyer=null; let isUnlocked=false; let threads=[];

async function loadBalance(){
 try{
  let r=await fetch(`/api/coins/balance?email=${encodeURIComponent(currentUser.email||'')}&phone=${encodeURIComponent(currentUser.phone||'')}`);
  let d=await r.json();
  document.getElementById('coinBal').innerText=(d.coins||0)+' coins';
 }catch(e){}
}

async function loadThreads(){
 try{
  let email=currentUser.email||'';
  let shopSlug=currentUser.business ? currentUser.business.toLowerCase().replace(/\s+/g,'-') : '';
  let url = `/api/chat/threads?shop=${encodeURIComponent(shopSlug)}`;
  if(!shopSlug) url=`/api/chat/my-threads?buyer=${encodeURIComponent(email)}`;
  let r=await fetch(url);
  let data=await r.json();
  threads=data||[];
  if(threads.length==0){
   // Also try my-threads as buyer
   let r2=await fetch(`/api/chat/my-threads?buyer=${encodeURIComponent(email)}`);
   let d2=await r2.json();
   threads=d2||[];
  }
  renderThreads();
 }catch(e){document.getElementById('threadsList').innerHTML='<p style="color:red;text-align:center">Error: '+e.message+'</p>';}
}

function renderThreads(){
 let q=document.getElementById('searchThread').value.toLowerCase();
 let filtered=threads.filter(t=> (t.buyer_email||'').toLowerCase().includes(q) || (t.shop_slug||'').toLowerCase().includes(q));
 if(filtered.length==0){document.getElementById('threadsList').innerHTML='<p style="text-align:center;padding:20px;color:#666">No chats yet<br><small>Start chatting from a shop page!</small></p>';return;}
 document.getElementById('threadsList').innerHTML=filtered.map(t=>{
  let initial=(t.buyer_email||t.shop_slug||'U')[0].toUpperCase();
  let name=t.buyer_email ? t.buyer_email.split('@')[0] : t.shop_slug;
  let last = t.last_text ? t.last_text.slice(0,30) : 'New chat';
  return `<div class="thread" onclick="openChat('${t.shop_slug}','${t.buyer_email}')"><div class="avatar">${initial}</div><div style="flex:1"><b>${name}</b><br><small style="color:#666">${last}</small></div><small>${t.last_time ? new Date(t.last_time*1000).toLocaleTimeString() : ''}</small></div>`;
 }).join('');
}

function filterThreads(){renderThreads();}

async function openChat(shopSlug, buyerEmail){
 currentShop=shopSlug; currentBuyer=buyerEmail || currentUser.email;
 document.getElementById('noChatSelected').style.display='none';
 document.getElementById('chatHeader').classList.remove('hidden');
 document.getElementById('inputBar').classList.remove('hidden');
 document.getElementById('chatName').innerText=shopSlug||buyerEmail;
 document.getElementById('chatAvatar').innerText=(shopSlug||buyerEmail||'S')[0].toUpperCase();
 document.getElementById('threadsPanel').classList.add('hidden-mobile');
 document.getElementById('chatPanel').classList.remove('hidden-mobile');
 // Check unlock
 await checkUnlock();
 await loadMessages();
}

function closeChat(){
 document.getElementById('threadsPanel').classList.remove('hidden-mobile');
 document.getElementById('chatPanel').classList.add('hidden-mobile');
 document.getElementById('noChatSelected').style.display='flex';
 document.getElementById('chatHeader').classList.add('hidden');
 document.getElementById('inputBar').classList.add('hidden');
 document.getElementById('unlockBox').classList.add('hidden');
 currentShop=null;
}

async function checkUnlock(){
 try{
  let buyer=currentBuyer||currentUser.email;
  let r=await fetch(`/api/chat/check-unlock?buyer=${encodeURIComponent(buyer)}&shop=${encodeURIComponent(currentShop)}&type=chat`);
  let d=await r.json();
  isUnlocked=d.unlocked;
  document.getElementById('unlockBox').classList.toggle('hidden', isUnlocked);
  document.getElementById('messagesList').classList.toggle('hidden', !isUnlocked);
  document.getElementById('inputBar').classList.toggle('hidden', !isUnlocked);
 }catch(e){isUnlocked=false; document.getElementById('unlockBox').classList.remove('hidden');}
}

async function unlockChat(){
 if(!currentUser.email){alert('Login first!');return;}
 document.getElementById('unlockStatus').innerText='⏳ Unlocking...';
 try{
  let r=await fetch('/api/chat/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:currentBuyer||currentUser.email,shop_slug:currentShop,type:'chat'})});
  let d=await r.json();
  document.getElementById('unlockStatus').innerText=d.success ? '✅ Unlocked!' : '❌ '+d.error;
  if(d.success){ isUnlocked=true; document.getElementById('unlockBox').classList.add('hidden'); document.getElementById('messagesList').classList.remove('hidden'); document.getElementById('inputBar').classList.remove('hidden'); loadBalance(); loadMessages(); }
 }catch(e){document.getElementById('unlockStatus').innerText='Error: '+e.message;}
}

async function loadMessages(){
 if(!currentShop || !currentBuyer) return;
 try{
  let r=await fetch(`/api/chat/history?buyer=${encodeURIComponent(currentBuyer)}&shop=${encodeURIComponent(currentShop)}`);
  let msgs=await r.json();
  document.getElementById('messagesList').innerHTML=msgs.map(m=>`<div class="msg ${m.sender==='buyer'?'msg-buyer':'msg-seller'}">${m.text}<br><small style="font-size:10px;color:#666">${new Date(m.time*1000).toLocaleTimeString()}</small></div>`).join('');
  document.getElementById('messagesList').scrollTop=document.getElementById('messagesList').scrollHeight;
 }catch(e){document.getElementById('messagesList').innerHTML='<p style="color:red">Failed to load</p>';}
}

async function sendMsg(){
 let text=document.getElementById('msgInput').value.trim();
 if(!text) return;
 if(!isUnlocked){alert('Unlock chat first - 1 coin!');return;}
 let sender = (currentUser.email && currentBuyer && currentUser.email.toLowerCase()===currentBuyer.toLowerCase()) ? 'buyer' : 'seller';
 // If I am buyer, sender=buyer, else seller
 if(currentUser.email.toLowerCase()===currentBuyer.toLowerCase()) sender='buyer'; else sender='seller';
 try{
  await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({buyer_email:currentBuyer,shop_slug:currentShop,sender:sender,text:text})});
  document.getElementById('msgInput').value='';
  loadMessages();
 }catch(e){alert('Failed: '+e.message);}
}

// Auto check URL ?shop=xxx&buyer=yyy
let params=new URLSearchParams(location.search);
let shopParam=params.get('shop'); let buyerParam=params.get('buyer');
if(shopParam){ openChat(shopParam, buyerParam||currentUser.email); }

loadBalance(); loadThreads();
setInterval(()=>{ if(currentShop) loadMessages(); }, 3000);
</script>
</body>
</html>
