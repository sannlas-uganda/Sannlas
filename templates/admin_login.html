<!DOCTYPE html><html><head><title>Admin Login</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.box{background:#1a1a1a;padding:30px;border-radius:15px;width:90%;max-width:400px;border:1px solid #ff6a00}input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff}button{width:100%;padding:12px;background:#ff6a00;color:#fff;border:none;border-radius:8px;font-weight:bold}h2{text-align:center;color:#ff6a00}</style></head><body><div class="box"><h2>🔒 Admin Login</h2><form id="f"><input type="password" id="pwd" placeholder="Admin Password" required><button type="submit">Login</button></form><div id="msg" style="color:#ff4444;margin-top:10px"></div></div><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();let r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pwd').value})});let d=await r.json();if(d.success)location='/admin';else document.getElementById('msg').textContent='Wrong password';});</script></body></html>
