<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Products - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9EFF7;font-family:system-ui;padding-bottom:80px}
.header{padding:14px 16px;background:white;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:1400px;margin:0 auto}
@media(min-width:768px){.products-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1.5px solid #e2e8f0;position:relative;cursor:pointer}
.product-card img{width:100%;height:180px;object-fit:cover;background:#f6f7f8;display:block}
.p-info{padding:10px}
.off{background:#FF0000;color:white;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:900;position:absolute;top:8px;left:8px;z-index:2}
.photo-count{background:rgba(0,0,0,0.7);color:white;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:900;position:absolute;bottom:8px;right:8px;z-index:2}
.search-bar{margin:12px auto;max-width:780px;background:white;padding:8px 14px;border-radius:28px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search-bar input{border:none;outline:none;flex:1;padding:8px}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;z-index:9999;padding:12px}
.popup-content{border-radius:28px;max-width:950px;width:98%;max-height:95vh;overflow:hidden;border:2px solid rgba(255,255,255,0.8);box-shadow:0 25px 80px rgba(0,0,0,0.4);transition:background 0.5s ease}
.pro-top{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(0,0,0,0.06);background:rgba(255,255,255,0.6);backdrop-filter:blur(10px)}
.pro-body{display:grid;grid-template-columns:1.2fr 1fr;gap:0;min-height:480px}
@media(max-width:700px){.pro-body{grid-template-columns:1fr;overflow-y:auto;max-height:calc(95vh - 60px)}}
.pro-left{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.pro-img{width:100%;max-width:380px;height:340px;object-fit:contain;border-radius:20px;background:transparent;filter:drop-shadow(0 25px 30px rgba(0,0,0,0.35));transition:opacity 0.3s}
@media(max-width:700px){.pro-img{height:280px}}
.pro-right{padding:20px;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);display:flex;flex-direction:column;justify-content:center}
.arrow-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.7);color:white;border:none;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
.arrow-btn:active{transform:translateY(-50%) scale(0.9)}
.arrow-left{left:12px}
.arrow-right{right:12px}
.thumb{width:60px;height:60px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,0.9);cursor:pointer;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
.thumb.active{border:3px solid #FF6600;transform:scale(1.1)}
.size-btn{padding:8px 14px;border-radius:50%;border:2px solid #000;background:white;color:#000;font-weight:800;font-size:12px;cursor:pointer;min-width:42px}
.size-btn.active{background:#000;color:white}
.next-preview{position:absolute;bottom:12px;right:12px;text-align:center;z-index:4}
.next-preview img{width:60px;height:70px;object-fit:cover;border-radius:10px;border:2px solid white;box-shadow:0 8px 20px rgba(0,0,0,0.3)}
.btn{border:none;padding:12px 18px;border-radius:20px;font-weight:900;cursor:pointer}
.btn-black{background:#000;color:#FFCC02;width:100%}
.btn-orange{background:#FF6600;color:white;width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="header">
  <a href="/" style="text-decoration:none;color:black;font-weight:900;">← Home</a>
  <b>SANNLAS PRODUCTS</b>
  <span>🛒</span>
</div>

<div class="search-bar">
  <span>🔍</span>
  <input id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
</div>

<div id="products" class="products-grid">Loading Boss...</div>

<div class="popup" id="viewPop" onclick="closePop()">
  <div class="popup-content" id="viewContent" onclick="event.stopPropagation()">
  </div>
</div>

<script>
let allProducts=[];
let currentImgs=[];
let currentIdx=0;
let selectedSize='';

let bgColors=[
  'linear-gradient(135deg,#FFE8EC,#FFD6DE)',
  'linear-gradient(135deg,#E8F0FF,#D6E4FF)',
  'linear-gradient(135deg,#FFF3D6,#FFE8A3)',
  'linear-gradient(135deg,#E6FFE6,#C8FFC8)',
  'linear-gradient(135deg,#F0E6FF,#DCC8FF)',
  'linear-gradient(135deg,#FFE6D6,#FFC8A3)'
];

async function load(){
  const r = await fetch('/api/products?limit=200');
  allProducts = await r.json();
  render(allProducts);
}

// KEPT FROM YOUR FILE: Get all images, not just p.image
function getAllImages(p){
  if(p.images && Array.isArray(p.images) && p.images.length>0) return p.images;
  if(typeof p.images === 'string' && p.images.length>0){
    try { let parsed = JSON.parse(p.images); if(Array.isArray(parsed)) return parsed; } catch(e){}
    if(p.images.includes(',')) return p.images.split(',');
    return [p.images];
  }
  if(p.image) return [p.image];
  if(p.image_url) return [p.image_url];
  return ['/icon-192.png'];
}

function render(list){
  document.getElementById('products').innerHTML = list.map(p=>{
    let name = p.name || p.product_name || 'Product';
    let img = getAllImages(p)[0];
    let price = p.price || 0;
    let discount = p.original_price && p.original_price > price ? Math.round((p.original_price - price)*100/p.original_price) + '% OFF' : '10% OFF';
    let count = getAllImages(p).length;
    let badge = count > 1 ? `<span class="photo-count">📸 ${count} photos</span>` : '';
    return `
    <div class="product-card" onclick="openProduct('${p.id}')">
      <span class="off">${discount}</span>
      ${badge}
      <img src="${img}" onerror="this.src='/icon-192.png'" loading="lazy">
      <div class="p-info">
        <div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
        <b style="color:#FF6600;font-size:13px">UGX ${Number(price).toLocaleString()}</b>
        <div style="font-size:10px;color:#666">📍 ${p.location||'Kampala'}</div>
      </div>
    </div>`;
  }).join('');
}

function isFashion(p){
  let cat = ((p.main_category||'')+' '+(p.category||'')+' '+(p.name||'')).toLowerCase();
  return cat.includes('fashion')||cat.includes('cloth')||cat.includes('shirt')||cat.includes('dress')||cat.includes('shoe')||cat.includes('sneaker')||cat.includes('hoodie')||cat.includes('jacket')||cat.includes('trouser')||cat.includes('jeans')||cat.includes('t-shirt');
}

// CHANGED: Now with sliding + TikTok style, still 4 photos
function openProduct(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  if(!p) return;
  currentImgs = getAllImages(p);
  currentIdx = 0;
  selectedSize = '';
  let name = p.name || p.product_name || 'Product';
  let price = p.price || 0;
  let orig = p.original_price || price;
  let desc = p.description || p.desc || 'No description. Contact seller for details.';
  let phone = p.phone || p.business_phone || 'Contact via Shop';
  let biz = p.business || p.business_name || 'SANNLAS Seller';

  let sizeHtml = '';
  if(isFashion(p)){
    sizeHtml = `
    <div style="margin:14px 0">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">Choose your size</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="size-btn" onclick="pickSize(this,'XL')">XL</button>
        <button class="size-btn" onclick="pickSize(this,'2XL')">2XL</button>
        <button class="size-btn" onclick="pickSize(this,'3XL')">3XL</button>
        <button class="size-btn" onclick="pickSize(this,'4XL')">4XL</button>
      </div>
    </div>`;
  }

  let thumbsHtml = currentImgs.map((im,i)=>`<img src="${im}" class="thumb ${i==0?'active':''}" onclick="goToImg(${i})" onerror="this.style.display='none'">`).join('');
  let nextIdx = (currentIdx+1) % currentImgs.length;
  let nextPreview = currentImgs.length>1 ? `<div class="next-preview"><img id="nextImg" src="${currentImgs[nextIdx]}"><div style="font-size:10px;font-weight:700;background:rgba(0,0,0,0.6);color:white;border-radius:8px;padding:2px 6px;margin-top:2px">Next →</div></div>` : '';

  document.getElementById('viewContent').innerHTML = `
    <div class="pro-top">
      <b style="font-size:16px">🛍️ ${name}</b>
      <button onclick="closePop()" style="background:white;border:1px solid #ddd;width:36px;height:36px;border-radius:50%;font-weight:900">✕</button>
    </div>
    <div class="pro-body">
      <div class="pro-left">
        <button class="arrow-btn arrow-left" onclick="prevImg(event)">‹</button>
        <img id="mainImg" src="${currentImgs[0]}" class="pro-img" onerror="this.src='/icon-192.png'">
        <button class="arrow-btn arrow-right" onclick="nextImg(event)">›</button>
        <div style="background:rgba(0,0,0,0.6);color:white;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;margin-top:12px" id="counter">1 / ${currentImgs.length} 📸</div>
        <div style="display:flex;gap:8px;margin-top:12px;overflow-x:auto;max-width:100%;padding:4px">${thumbsHtml}</div>
        ${nextPreview}
      </div>
      <div class="pro-right">
        <h2 style="font-size:20px;line-height:1.2">${name}</h2>
        <p style="font-size:12px;color:#666;margin:8px 0;line-height:1.4">${desc.slice(0,150)}</p>
        <div style="margin:10px 0">
          <b style="font-size:26px;color:#FF6600">UGX ${Number(price).toLocaleString()}</b>
          ${orig>price?`<div><span style="text-decoration:line-through;color:#999;font-size:14px">UGX ${Number(orig).toLocaleString()}</span> <span style="background:#FF0000;color:white;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:900">${Math.round((orig-price)*100/orig)}% OFF</span></div>`:''}
        </div>
        ${sizeHtml}
        <div style="background:white;padding:12px;border-radius:14px;margin:10px 0;border:1px solid #eee">
          <b style="font-size:12px">🏪 ${biz}</b><br>
          <span style="font-size:12px;color:#666">📞 ${phone}</span><br>
          <span style="font-size:11px;color:#888">📍 ${p.location||'Kampala'}</span>
        </div>
        <button class="btn btn-black" onclick="orderNow('${p.id}')">💬 Order via WhatsApp</button>
        <button class="btn btn-orange" onclick="addToCart('${p.id}')">🛒 Add to Cart</button>
        <button class="btn" style="background:#f0f0f0;width:100%;margin-top:8px" onclick="closePop()">Continue Shopping</button>
        <p style="text-align:center;color:#888;font-size:11px;margin-top:10px">Dress Better. Feel Better.</p>
      </div>
    </div>
  `;
  updateBg();
  document.getElementById('viewPop').style.display='flex';
}

// NEW: Sliding logic
function updateBg(){
  let el = document.getElementById('viewContent');
  if(el) el.style.background = bgColors[currentIdx % bgColors.length];
}
function showImg(idx){
  currentIdx = (idx + currentImgs.length) % currentImgs.length;
  let main = document.getElementById('mainImg');
  if(main){
    main.style.opacity = 0;
    setTimeout(()=>{ main.src = currentImgs[currentIdx]; main.style.opacity = 1; }, 150);
  }
  document.querySelectorAll('.thumb').forEach((t,i)=>{ t.classList.toggle('active', i===currentIdx); });
  let c = document.getElementById('counter');
  if(c) c.textContent = (currentIdx+1) + ' / ' + currentImgs.length + ' 📸';
  let nextImg = document.getElementById('nextImg');
  if(nextImg) nextImg.src = currentImgs[(currentIdx+1) % currentImgs.length];
  updateBg();
}
function nextImg(e){ if(e) e.stopPropagation(); showImg(currentIdx+1); }
function prevImg(e){ if(e) e.stopPropagation(); showImg(currentIdx-1); }
function goToImg(i){ showImg(i); }
function pickSize(btn, size){
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// KEPT FROM YOUR FILE
function closePop(){ document.getElementById('viewPop').style.display='none'; }
function filterProducts(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  render(allProducts.filter(p=> (p.name||'').toLowerCase().includes(q)));
}
function getUser(){
  try {
    let u = JSON.parse(localStorage.getItem('sannlas_user')|| localStorage.getItem('user') || '{}');
    if(!u.email){
      let email = localStorage.getItem('sannlas_email') || localStorage.getItem('email') || '';
      let phone = localStorage.getItem('sannlas_phone') || localStorage.getItem('phone') || '';
      return {email: email, phone: phone};
    }
    return u;
  } catch(e){
    return {email:'', phone:''};
  }
}

function orderNow(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  if(!p) return;
  let name = p.name || p.product_name || 'Product';
  let price = p.price || 0;
  let sizeText = selectedSize ? ' Size: '+selectedSize : '';
  let msg = `Hi Boss! I want ${name} - UGX ${Number(price).toLocaleString()}${sizeText} - Product ID ${id} - from SANNLAS PRODUCTS`;
  window.open(`https://wa.me/256795712326?text=${encodeURIComponent(msg)}`,'_blank');
}

async function addToCart(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  if(!p){
    alert('Product not found!');
    return;
  }
  let user = getUser();
  let email = (user.email || '').toLowerCase().trim();
  let phone = (user.phone || '').trim();
  if(!email && !phone){
    alert('⚠️ Please login first Boss! Go to Home and login.');
    window.location.href = '/';
    return;
  }
  let payload = {
    email: email,
    phone: phone,
    product_id: String(p.id),
    name: p.name || p.product_name || 'Product',
    price: Number(p.price || 0),
    image: getAllImages(p)[0],
    shop_name: p.business || p.business_name || p.shop_name || 'SANNLAS',
    shop_slug: p.shop_slug || p.slug || '',
    qty: 1,
    size: selectedSize || ''
  };
  try {
    let r = await fetch('/api/cart/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    let res = await r.json();
    if(res.success){
      let cart = JSON.parse(localStorage.getItem('sannlas_cart')||'[]');
      if(!cart.includes(id)) cart.push(id);
      localStorage.setItem('sannlas_cart', JSON.stringify(cart));
      alert('✅ ' + res.message + (selectedSize ? ' Size: '+selectedSize : '') + ' Go to Cart to view!');
      closePop();
    } else {
      alert('❌ ' + (res.message || 'Failed to add'));
    }
  } catch(e){
    console.log(e);
    alert('❌ Network error Boss! Try again');
  }
}

// NEW: Swipe on mobile
let startX = 0;
document.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(document.getElementById('viewPop').style.display !== 'flex') return;
  let endX = e.changedTouches[0].clientX;
  let diff = endX - startX;
  if(Math.abs(diff) > 50){
    if(diff < 0) showImg(currentIdx+1);
    else showImg(currentIdx-1);
  }
}, {passive:true});

load();
</script>
</body>
</html>
