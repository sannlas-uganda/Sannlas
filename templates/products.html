<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Products - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#f0f4f8; font-family:system-ui}
.header{padding:15px; background:white; display:flex; justify-content:space-between; position:sticky; top:0; z-index:99; box-shadow:0 2px 10px rgba(0,0,0,.1)}
.products-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:12px}
@media(min-width:768px){ .products-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:white; border-radius:15px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.1)}
.product-card img{width:100%; height:180px; object-fit:cover}
.p-info{padding:10px} .off{background:red;color:white;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:900;position:absolute;top:8px;left:8px}
.btn-black{background:black;color:#FFCC02;padding:12px 20px;border-radius:25px;text-decoration:none;font-weight:900;display:inline-block;border:2px solid #FFCC02}
.search-bar{margin:12px; background:white; padding:10px 15px; border-radius:25px; display:flex; gap:10px}
.search-bar input{border:none; outline:none; flex:1}
</style></head><body>
<div class="header">
  <a href="/" style="text-decoration:none; color:black; font-weight:900;">← Home</a>
  <b>SANNLAS PRODUCTS</b>
  <a href="/cart">🛒</a>
</div>

<div class="search-bar">
  <span>🔍</span>
  <input id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
</div>

<div id="products" class="products-grid">Loading...</div>

<script>
let allProducts=[];
async function load(){
  const r=await fetch('/api/all-products'); allProducts=await r.json();
  render(allProducts);
}
function render(list){
  document.getElementById('products').innerHTML = list.map(p=>`
    <div class="product-card" style="position:relative">
      <span class="off">${p.discount||'10% OFF'}</span>
      <img src="${p.image_url||p.image}" onclick="location.href='/product/${p.id}'">
      <div class="p-info">
        <div style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${p.title||p.name}</div>
        <b style="color:#FF6600">UGX ${(p.price||0).toLocaleString()}</b>
      </div>
    </div>
  `).join('') || '<p style="padding:20px">No products found</p>';
}
function filterProducts(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  render(allProducts.filter(p=> (p.title||p.name||'').toLowerCase().includes(q)));
}
load();
</script></body></html>
