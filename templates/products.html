<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Products - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9EFF7;font-family:system-ui;padding-bottom:80px}
.header{padding:14px 16px;background:white;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:1400px;margin:0 auto}
@media(min-width:768px){.products-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1.5px solid #e2e8f0;position:relative;cursor:pointer}
.product-card img{width:100%;height:180px;object-fit:cover;background:#f6f7f8;display:block}
.p-info{padding:10px}
.off{background:#FF0000;color:white;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:900;position:absolute;top:8px;left:8px;z-index:2}
.photo-count{background:rgba(0,0,0,0.7);color:white;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:900;position:absolute;bottom:8px;right:8px;z-index:2}
.search-bar{margin:12px auto;max-width:780px;background:white;padding:8px 14px;border-radius:28px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search-bar input{border:none;outline:none;flex:1;padding:8px}

/* ===== TIKTOK EXACT LAYOUT ===== */
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:0}
.popup-content{width:100%;height:100%;max-width:1200px;max-height:100vh;overflow:hidden;position:relative;transition:background 0.6s ease;display:flex;flex-direction:column}
@media(min-width:700px){.popup-content{border-radius:28px;width:98%;height:92vh;max-height:720px}}
.tik-top{display:flex;justify-content:space-between;align-items:center;padding:16px 28px}
.tik-top .logo{font-family:Georgia,serif;font-size:22px;font-weight:900;letter-spacing:1px}
.tik-top .nav{display:flex;gap:18px;font-size:13px;font-weight:600}
.tik-top .nav span{cursor:pointer;opacity:0.7}
.tik-top .nav span.active{background:white;padding:4px 10px;border-radius:20px;opacity:1}
.tik-main{flex:1;display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:center;gap:10px;padding:0 28px;position:relative}
@media(max-width:700px){.tik-main{grid-template-columns:1fr;padding:10px 18px;overflow-y:auto}.tik-left{display:none}.tik-right{order:3}.tik-center{order:1}}
.tik-left h1{font-family:Georgia,serif;font-size:38px;line-height:1.1;font-weight:900}
@media(max-width:900px){.tik-left h1{font-size:28px}}
.tik-left p{font-size:12px;line-height:1.5;color:#333;margin:14px 0;opacity:0.8}
.get-look{background:#000;color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
.tik-center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hanger{font-size:28px;margin-bottom:-8px;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.2))}
.slider-viewport{width:100%;max-width:360px;height:360px;overflow:hidden;border-radius:20px;cursor:grab;touch-action:pan-y}
@media(max-width:700px){.slider-viewport{height:280px}}
.slider-track{display:flex;flex-direction:column;width:100%;height:100%;transition:transform 0.65s cubic-bezier(0.34,1.4,0.64,1)}
.slider-track img{animation:fallIn 0.65s cubic-bezier(0.34,1.4,0.64,1)}
@keyframes fallIn{
  0%{transform:translateY(-120%) scale(0.85);opacity:0}
  60%{transform:translateY(15px) scale(1.02);opacity:1}
  80%{transform:translateY(-6px) scale(0.99)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.shadow-ellipse{animation:shadowGrow 0.65s ease}
@keyframes shadowGrow{
  0%{transform:scale(0.4);opacity:0}
  60%{transform:scale(1.15);opacity:0.8}
  100%{transform:scale(1);opacity:1}
}
.slider-track.no-anim{transition:none}
.slider-track img{width:100%;height:100%;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 25px 25px rgba(0,0,0,0.35));pointer-events:none;user-select:none;-webkit-user-drag:none}
.shadow-ellipse{width:160px;height:18px;background:radial-gradient(ellipse,rgba(0,0,0,0.35),transparent);border-radius:50%;margin-top:6px}
.tik-right{text-align:right}
.tik-right .price{font-size:30px;font-weight:900}
.tik-right .old-price{font-size:18px;color:#555;text-decoration:line-through;margin-top:2px}
.tik-right .size-label{font-size:12px;margin:14px 0 8px}
.size-btn{width:42px;height:42px;border-radius:50%;border:2px solid #000;background:#000;color:white;font-weight:800;font-size:11px;cursor:pointer}
.size-btn.active{background:white;color:#000}
.tik-bottom{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 28px 20px}
.tik-bottom .socials{font-size:16px;letter-spacing:8px}
.arrow-btn{width:46px;height:46px;border-radius:50%;border:2px solid #000;background:transparent;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.arrow-btn:active{transform:scale(0.9)}
.next-preview{text-align:center}
.next-preview img{width:70px;height:80px;object-fit:cover;border-radius:12px;border:2px solid white;box-shadow:0 8px 20px rgba(0,0,0,0.3);background:white}
.counter{font-size:12px;font-weight:800;background:rgba(0,0,0,0.6);color:white;padding:4px 10px;border-radius:20px;display:inline-block;margin-top:8px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;border:2px solid white;cursor:pointer;background:white}
.thumb.active{border:3px solid #FF6600}
.btn{border:none;padding:12px 18px;border-radius:20px;font-weight:900;cursor:pointer}
.btn-black{background:#000;color:#FFCC02;width:100%}
.btn-orange{background:#FF6600;color:white;width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="header">
  <a href="/" style="text-decoration:none;color:black;font-weight:900;">← Home</a>
  <b>SANNLAS PRODUCTS</b>
  <span>🛒</span>
</div>
<div class="search-bar"><span>🔍</span><input id="searchInput" placeholder="Search products..." onkeyup="filterProducts()"></div>
<div id="products" class="products-grid">Loading Boss...</div>
<div class="popup" id="viewPop" onclick="closePop()">
  <div class="popup-content" id="viewContent" onclick="event.stopPropagation()"></div>
</div>
<script>
let allProducts=[];
let currentImgs=[];
let currentIdx=0;
let selectedSize='';
// TikTok colors - background changes to match shirt!
let bgColors=[
  'linear-gradient(180deg,#F8D7DE,#F5C6D0)',
  'linear-gradient(180deg,#E91E63,#D81B60)',
  'linear-gradient(180deg,#8B6F5E,#7A5E4F)',
  'linear-gradient(180deg,#F5E6C8,#EED9A8)',
  'linear-gradient(180deg,#4A4A4A,#333333)',
  'linear-gradient(180deg,#FFF3D6,#FFE8A3)',
  'linear-gradient(180deg,#E8F0FF,#D6E4FF)',
  'linear-gradient(180deg,#E6FFE6,#C8FFC8)'
];
async function load(){
  const r = await fetch('/api/products?limit=200');
  allProducts = await r.json();
  render(allProducts);
}
function getAllImages(p){
  if(p.images && Array.isArray(p.images) && p.images.length>0) return p.images;
  if(typeof p.images === 'string' && p.images.length>0){
    try { let parsed = JSON.parse(p.images); if(Array.isArray(parsed)) return parsed; } catch(e){}
    if(p.images.includes(',')) return p.images.split(',');
    return [p.images];
  }
  if(p.image) return [p.image];
  if(p.image_url) return [p.image_url];
  return ['/icon-192.png'];
}
function render(list){
  document.getElementById('products').innerHTML = list.map(p=>{
    let name = p.name || p.product_name || 'Product';
    let img = getAllImages(p)[0];
    let price = p.price || 0;
    let discount = p.original_price && p.original_price > price ? Math.round((p.original_price - price)*100/p.original_price) + '% OFF' : '10% OFF';
    let count = getAllImages(p).length;
    let badge = count > 1 ? `<span class="photo-count">📸 ${count} photos</span>` : '';
    return `<div class="product-card" onclick="openProduct('${p.id}')">
      <span class="off">${discount}</span>${badge}
      <img src="${img}" onerror="this.src='/icon-192.png'" loading="lazy">
      <div class="p-info">
        <div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
        <b style="color:#FF6600;font-size:13px">UGX ${Number(price).toLocaleString()}</b>
        <div style="font-size:10px;color:#666">📍 ${p.location||'Kampala'}</div>
      </div></div>`;
  }).join('');
}
function isFashion(p){
  let cat = ((p.main_category||'')+' '+(p.category||'')+' '+(p.name||'')).toLowerCase();
  return cat.includes('fashion')||cat.includes('cloth')||cat.includes('shirt')||cat.includes('dress')||cat.includes('shoe')||cat.includes('sneaker')||cat.includes('hoodie')||cat.includes('jacket')||cat.includes('trouser')||cat.includes('jeans')||cat.includes('t-shirt');
}
function openProduct(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  if(!p) return;
  currentImgs = getAllImages(p);
  currentIdx = 0;
  selectedSize = '';
  let name = p.name || p.product_name || 'Product';
  let price = p.price || 0;
  let orig = p.original_price || price;
  let desc = p.description || p.desc || 'Discover premium t-shirts, hoodies, and sweatshirts designed for comfort, quality, and everyday expression.';
  let phone = p.phone || p.business_phone || 'Contact via Shop';
  let biz = p.business || p.business_name || 'SANNLAS Seller';
  let isFash = isFashion(p);
  let sizeHtml = '';
  if(isFash){
    sizeHtml = `<div class="size-label">Choose your size</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="size-btn active" onclick="pickSize(this,'XL')">XL</button>
      <button class="size-btn" onclick="pickSize(this,'2XL')">2XL</button>
      <button class="size-btn" onclick="pickSize(this,'3XL')">3XL</button>
      <button class="size-btn" onclick="pickSize(this,'4XL')">4XL</button>
    </div>`;
    selectedSize='XL';
  } else {
    sizeHtml = `<div class="size-label">🏪 ${biz}<br>📞 ${phone}</div>`;
  }
  let nextIdx = (currentIdx+1) % currentImgs.length;
  let thumbsHtml = currentImgs.map((im,i)=>`<img src="${im}" class="thumb ${i==0?'active':''}" onclick="goToImg(${i})" onerror="this.style.display='none'">`).join('');
  document.getElementById('viewContent').innerHTML = `
    <div class="tik-top">
      <div class="logo">SANNLAS 👕</div>
      <div class="nav"><span>Home</span><span class="active">Tshirt</span><span>Hoodies</span><span>Sweatshirts</span><span>About Us</span></div>
      <div style="display:flex;gap:12px;align-items:center"><span>👤</span><span>🔔</span><button onclick="closePop()" style="background:white;border:1px solid #ddd;width:32px;height:32px;border-radius:50%;font-weight:900;cursor:pointer">✕</button></div>
    </div>
    <div class="tik-main">
      <div class="tik-left">
        <h1>Wear Confidence<br>Define Your Style.</h1>
        <p>${desc.slice(0,140)}</p>
        <button class="get-look" onclick="orderNow('${p.id}')">Get the look ›</button>
        <div style="margin-top:16px;display:flex;gap:6px;flex-wrap:wrap">${thumbsHtml}</div>
        <div style="font-size:11px;color:#333;margin-top:8px">📸 ${currentImgs.length} photos - Tap to view</div>
      </div>
      <div class="tik-center">
        <div class="hanger">🪝</div>
        <div class="slider-viewport" id="sliderViewport">
          <div class="slider-track" id="sliderTrack">
            ${currentImgs.map(im=>`<img src="${im}" onerror="this.src='/icon-192.png'">`).join('')}
          </div>
        </div>
        <div class="shadow-ellipse"></div>
        <div class="counter" id="counter">1 / ${currentImgs.length} 📸</div>
      </div>
      <div class="tik-right">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px">${name}</div>
        <div class="price">UGX ${Number(price).toLocaleString()}</div>
        ${orig>price?`<div class="old-price">UGX ${Number(orig).toLocaleString()}</div>`:''}
        ${sizeHtml}
        <div style="margin-top:14px">
          <button class="btn btn-black" onclick="orderNow('${p.id}')">💬 Order via WhatsApp</button>
          <button class="btn btn-orange" onclick="addToCart('${p.id}')">🛒 Add to Cart</button>
        </div>
        <div style="font-size:11px;color:#333;margin-top:8px">📍 ${p.location||'Kampala'} • 🏪 ${biz}</div>
      </div>
    </div>
    <div class="tik-bottom">
      <div>
        <div class="socials">📸 𝕏 in 🎵</div>
        <button class="arrow-btn" onclick="prevImg(event)" style="margin-top:10px">‹</button>
      </div>
      <div style="text-align:center">Dress Better.<br>Feel Better.</div>
      <div style="display:flex;align-items:flex-end;gap:10px">
        <div class="next-preview"><img id="nextImg" src="${currentImgs[nextIdx]}" onerror="this.style.display='none'"><div style="font-size:10px;font-weight:700">Next →</div></div>
        <button class="arrow-btn" onclick="nextImg(event)">›</button>
      </div>
    </div>
  `;
  updateBg();
  document.getElementById('viewPop').style.display='flex';
  setupDrag();
}
function updateBg(){
  let el = document.getElementById('viewContent');
  if(el) el.style.background = bgColors[currentIdx % bgColors.length];
}
function showImg(idx){
  currentIdx = (idx + currentImgs.length) % currentImgs.length;
  let track = document.getElementById('sliderTrack');
  if(track){ track.classList.remove('no-anim'); track.style.transform = 'translateY(-' + (currentIdx * 100) + '%)';
// Re-trigger falling bounce
let imgs = track.querySelectorAll('img');
imgs.forEach(im=>{ im.style.animation='none'; void im.offsetWidth; im.style.animation=''; });
let shadow = document.querySelector('.shadow-ellipse');
if(shadow){ shadow.style.animation='none'; void shadow.offsetWidth; shadow.style.animation=''; } }
  document.querySelectorAll('.thumb').forEach((t,i)=>{ t.classList.toggle('active', i===currentIdx); });
  let c = document.getElementById('counter');
  if(c) c.textContent = (currentIdx+1) + ' / ' + currentImgs.length + ' 📸';
  let nextImg = document.getElementById('nextImg');
  if(nextImg) nextImg.src = currentImgs[(currentIdx+1) % currentImgs.length];
  updateBg();
}
function nextImg(e){ if(e) e.stopPropagation(); showImg(currentIdx+1); }
function prevImg(e){ if(e) e.stopPropagation(); showImg(currentIdx-1); }
function goToImg(i){ showImg(i); }
function pickSize(btn, size){
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
let dragStartX=0, dragCurrentX=0, isDragging=false;
function setupDrag(){
  let vp = document.getElementById('sliderViewport');
  let track = document.getElementById('sliderTrack');
  if(!vp || !track) return;
  function start(x){ isDragging=true; dragStartX=x; dragCurrentX=x; track.classList.add('no-anim'); }
  function move(x){
    if(!isDragging) return; dragCurrentX=x;
    let diff = dragCurrentX - dragStartX;
    let base = -currentIdx * vp.offsetHeight;
track.style.transform = 'translateY(' + (base + diff) + 'px)';
  }
  function end(){
    if(!isDragging) return; isDragging=false; track.classList.remove('no-anim');
    let diff = dragCurrentX - dragStartX;
    if(diff < -50) showImg(currentIdx+1);
    else if(diff > 50) showImg(currentIdx-1);
    else showImg(currentIdx);
  }
  vp.addEventListener('touchstart', e=>start(e.touches[0].clientX), {passive:true});
  vp.addEventListener('touchmove', e=>move(e.touches[0].clientX), {passive:true});
  vp.addEventListener('touchend', end);
  vp.addEventListener('mousedown', e=>{ e.preventDefault(); start(e.clientX); });
  window.addEventListener('mousemove', e=>move(e.clientX));
  window.addEventListener('mouseup', end);
}
function closePop(){ document.getElementById('viewPop').style.display='none'; }
function filterProducts(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  render(allProducts.filter(p=> (p.name||'').toLowerCase().includes(q)));
}
function getUser(){
  try {
    let u = JSON.parse(localStorage.getItem('sannlas_user')|| localStorage.getItem('user') || '{}');
    if(!u.email){
      let email = localStorage.getItem('sannlas_email') || localStorage.getItem('email') || '';
      let phone = localStorage.getItem('sannlas_phone') || localStorage.getItem('phone') || '';
      return {email: email, phone: phone};
    }
    return u;
  } catch(e){ return {email:'', phone:''}; }
}
function orderNow(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  if(!p) return;
  let name = p.name || p.product_name || 'Product';
  let price = p.price || 0;
  let sizeText = selectedSize ? ' Size: '+selectedSize : '';
  let msg = `Hi Boss! I want ${name} - UGX ${Number(price).toLocaleString()}${sizeText} - Product ID ${id} - from SANNLAS PRODUCTS`;
  window.open(`https://wa.me/256795712326?text=${encodeURIComponent(msg)}`,'_blank');
}
async function addToCart(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  if(!p){ alert('Product not found!'); return; }
  let user = getUser();
  let email = (user.email || '').toLowerCase().trim();
  let phone = (user.phone || '').trim();
  if(!email && !phone){ alert('⚠️ Please login first Boss! Go to Home and login.'); window.location.href = '/'; return; }
  let payload = { email: email, phone: phone, product_id: String(p.id), name: p.name || p.product_name || 'Product', price: Number(p.price || 0), image: getAllImages(p)[0], shop_name: p.business || p.business_name || p.shop_name || 'SANNLAS', shop_slug: p.shop_slug || p.slug || '', qty: 1, size: selectedSize || '' };
  try {
    let r = await fetch('/api/cart/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    let res = await r.json();
    if(res.success){
      let cart = JSON.parse(localStorage.getItem('sannlas_cart')||'[]');
      if(!cart.includes(id)) cart.push(id);
      localStorage.setItem('sannlas_cart', JSON.stringify(cart));
      alert('✅ ' + res.message + (selectedSize ? ' Size: '+selectedSize : '') + ' Go to Cart to view!');
      closePop();
    } else { alert('❌ ' + (res.message || 'Failed to add')); }
  } catch(e){ console.log(e); alert('❌ Network error Boss! Try again'); }
}
load();
</script>
</body>
</html>
