<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Products - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9EFF7;font-family:system-ui;padding-bottom:80px}
.header{padding:14px 16px;background:white;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:1400px;margin:0 auto}
@media(min-width:768px){.products-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1.5px solid #e2e8f0;position:relative;cursor:pointer}
.product-card img{width:100%;height:180px;object-fit:cover;background:#f6f7f8;display:block}
.p-info{padding:10px}
.off{background:#FF0000;color:white;padding:4px 8px;border-radius:8px;font-size:10px;font-weight:900;position:absolute;top:8px;left:8px;z-index:2}
.search-bar{margin:12px auto;max-width:780px;background:white;padding:8px 14px;border-radius:28px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search-bar input{border:none;outline:none;flex:1;padding:8px}
/* MODAL - SAME AS HOME PAGE */
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;z-index:9999;padding:12px}
.popup-content{background:rgba(255,255,255,0.9);backdrop-filter:blur(30px);border-radius:28px;max-width:900px;width:98%;max-height:95vh;overflow:auto;border:2px solid rgba(255,255,255,0.8);box-shadow:0 25px 80px rgba(0,0,0,0.4)}
.pro-top{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(0,0,0,0.06)}
.pro-body{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
@media(max-width:700px){.pro-body{grid-template-columns:1fr}}
.pro-img{width:100%;height:320px;object-fit:cover;border-radius:20px;background:#fff;border:2px solid rgba(255,255,255,0.8)}
.btn{border:none;padding:12px 18px;border-radius:20px;font-weight:900;cursor:pointer}
.btn-black{background:#000;color:#FFCC02;width:100%}
.btn-orange{background:#FF6600;color:white;width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="header">
  <a href="/" style="text-decoration:none;color:black;font-weight:900;">← Home</a>
  <b>SANNLAS PRODUCTS</b>
  <span>🛒</span>
</div>

<div class="search-bar">
  <span>🔍</span>
  <input id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
</div>

<div id="products" class="products-grid">Loading Boss...</div>

<!-- DETAILS MODAL - THIS WAS MISSING -->
<div class="popup" id="viewPop" onclick="closePop()">
  <div class="popup-content" id="viewContent" onclick="event.stopPropagation()">
  </div>
</div>

<script>
let allProducts=[];

async function load(){
  const r = await fetch('/api/products?limit=200');
  allProducts = await r.json();
  render(allProducts);
}

function render(list){
  document.getElementById('products').innerHTML = list.map(p=>{
    let name = p.name || p.product_name || 'Product';
    let img = p.image || p.image_url || '/icon-192.png';
    let price = p.price || 0;
    let discount = p.original_price && p.original_price > price ? Math.round((p.original_price - price)*100/p.original_price) + '% OFF' : '10% OFF';
    return `
    <div class="product-card" onclick="openProduct('${p.id}')">
      <span class="off">${discount}</span>
      <img src="${img}" onerror="this.src='/icon-192.png'" loading="lazy">
      <div class="p-info">
        <div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
        <b style="color:#FF6600;font-size:13px">UGX ${Number(price).toLocaleString()}</b>
        <div style="font-size:10px;color:#666">📍 ${p.location||'Kampala'}</div>
      </div>
    </div>`;
  }).join('');
}

function openProduct(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  if(!p) return;
  let name = p.name || p.product_name || 'Product';
  let img = p.image || p.image_url || '/icon-192.png';
  let price = p.price || 0;
  let orig = p.original_price || price;
  let desc = p.description || p.desc || 'No description. Contact seller for details.';
  let phone = p.phone || p.business_phone || 'Contact via Shop';
  let biz = p.business || p.business_name || 'SANNLAS Seller';

  document.getElementById('viewContent').innerHTML = `
    <div class="pro-top">
      <b style="font-size:16px">🛍️ ${name}</b>
      <button onclick="closePop()" style="background:white;border:1px solid #ddd;width:36px;height:36px;border-radius:50%;font-weight:900">✕</button>
    </div>
    <div class="pro-body">
      <div>
        <img src="${img}" class="pro-img">
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <span style="background:#f0f0f0;padding:6px 10px;border-radius:12px;font-size:11px">📍 ${p.location||'Kampala'}</span>
          <span style="background:#FF0000;color:white;padding:6px 10px;border-radius:12px;font-size:11px;font-weight:900">${orig>price?Math.round((orig-price)*100/orig)+'% OFF':'10% OFF'}</span>
        </div>
      </div>
      <div>
        <h2 style="font-size:18px">${name}</h2>
        <div style="margin:10px 0">
          <b style="font-size:22px;color:#FF6600">UGX ${Number(price).toLocaleString()}</b>
          ${orig>price?`<span style="text-decoration:line-through;color:#999;margin-left:8px">UGX ${Number(orig).toLocaleString()}</span>`:''}
        </div>
        <div style="background:white;padding:12px;border-radius:14px;margin:10px 0">
          <b style="font-size:12px">🏪 ${biz}</b><br>
          <span style="font-size:12px;color:#666">📞 ${phone}</span><br>
          <span style="font-size:11px;color:#888">${desc.slice(0,150)}</span>
        </div>
        <button class="btn btn-black" onclick="orderNow('${p.id}')">💬 Order via WhatsApp</button>
        <button class="btn btn-orange" onclick="addToCart('${p.id}')">🛒 Add to Cart</button>
        <button class="btn" style="background:#f0f0f0;width:100%;margin-top:8px" onclick="closePop()">Continue Shopping</button>
      </div>
    </div>
  `;
  document.getElementById('viewPop').style.display='flex';
}

function closePop(){ document.getElementById('viewPop').style.display='none'; }
function filterProducts(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  render(allProducts.filter(p=> (p.name||'').toLowerCase().includes(q)));
}
function orderNow(id){
  let p = allProducts.find(x=>String(x.id)===String(id));
  let msg = `Hi Boss! I want ${p.name} - UGX ${p.price} - from SANNLAS PRODUCTS`;
  window.open(`https://wa.me/256795712326?text=${encodeURIComponent(msg)}`,'_blank');
}
function addToCart(id){
  let cart = JSON.parse(localStorage.getItem('sannlas_cart')||'[]');
  cart.push(id);
  localStorage.setItem('sannlas_cart', JSON.stringify(cart));
  alert('✅ Added to cart Boss!');
  closePop();
}

load();
</script>
</body>
</html>
