<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet - Sannlas</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.bal{font-size:28px;font-weight:bold;color:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{padding:12px;border-radius:10px;text-align:center}
.box b{display:block;font-size:20px}
.bought{background:#e3f2fd;color:#0d47a1}
.earned{background:#e8f5e9;color:#1b5e20}
.spent{background:#ffebee;color:#b71c1c}
.total{background:#fff3e0;color:#e65100}
.withdrawable{background:#f3e5f5;color:#4a148c;border:2px solid #7b1fa2}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.btn-withdraw{background:#7b1fa2;color:#fff;margin-top:10px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:8px 0;box-sizing:border-box}
small{color:#666}
</style>
</head>
<body>

<h2>💰 My Wallet</h2>

<div class="card">
<div class="bal" id="totalBal">0 Coins</div>
<small id="totalUgx">UGX 0</small>
</div>

<div class="grid">
<div class="box bought"><b id="bought">0</b>BOUGHT<small id="boughtUgx"></small></div>
<div class="box earned"><b id="earned">0</b>EARNED<small id="earnedUgx"></small></div>
<div class="box spent"><b id="spent">0</b>SPENT<small id="spentUgx"></small></div>
<div class="box total"><b id="total">0</b>TOTAL<small>BOUGHT+EARNED-SPENT</small></div>
</div>

<div class="card" style="margin-top:12px">
<div class="box withdrawable">
<b id="withdrawable" style="font-size:28px">0</b>
WITHDRAWABLE (TOTAL - 10 free)<br>
<small id="withdrawableUgx">UGX 0</small><br>
<small>Min withdraw: 50 coins = UGX 29,950</small>
</div>
</div>

<div class="card">
<h3>Withdraw Coins</h3>
<input id="momo" placeholder="MTN MoMo Number e.g 077XXXXXXX">
<input id="coinsToWithdraw" type="number" placeholder="Coins to withdraw (min 50)">
<button class="btn btn-withdraw" onclick="withdraw()">Withdraw Now</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>History</h3>
<div id="history"></div>
</div>

<script>
const FREE_TRIAL = 10;
const MIN_WITHDRAW = 50;
const COIN_PRICE = 599;
let myUser = JSON.parse(localStorage.getItem('sannlas_user')||'{}');

async function loadBalance(){
 if(!myUser.email) return alert('Login first');
 const res = await fetch(`/api/coins/balance?email=${myUser.email}&phone=${myUser.phone}`);
 const d = await res.json();
 if(!d.success) return;
 document.getElementById('bought').innerText = d.bought;
 document.getElementById('boughtUgx').innerText = `UGX ${d.bought_value.toLocaleString()}`;
 document.getElementById('earned').innerText = d.earned;
 document.getElementById('earnedUgx').innerText = `UGX ${d.earned_value.toLocaleString()}`;
 document.getElementById('spent').innerText = d.spent;
 document.getElementById('spentUgx').innerText = `UGX ${d.spent_value.toLocaleString()}`;
 document.getElementById('total').innerText = d.total;
 document.getElementById('totalBal').innerText = `${d.total} Coins`;
 document.getElementById('totalUgx').innerText = `UGX ${d.total_value.toLocaleString()} (Bought ${d.bought}+Earned ${d.earned}-Spent ${d.spent})`;
 document.getElementById('withdrawable').innerText = d.withdrawable;
 document.getElementById('withdrawableUgx').innerText = `UGX ${d.withdrawable_value.toLocaleString()} = Total ${d.total} - ${FREE_TRIAL} free`;

 // history
 const res2 = await fetch(`/api/balance?email=${myUser.email}&phone=${myUser.phone}`);
 const d2 = await res2.json();
 let html='';
 (d2.history||[]).forEach(h=>{
   html+=`<div style="padding:8px;border-bottom:1px solid #eee">${h.reason||h.momo_code} - ${h.coins} coins</div>`;
 });
 document.getElementById('history').innerHTML = html||'No history';
}

async function withdraw(){
 const momo = document.getElementById('momo').value.trim();
 const coins = parseInt(document.getElementById('coinsToWithdraw').value);
 if(!momo) return alert('Enter MoMo number');
 if(coins < MIN_WITHDRAW) return alert(`Min withdraw is ${MIN_WITHDRAW} coins = UGX ${MIN_WITHDRAW*COIN_PRICE}!`);
 const res = await fetch('/api/withdraw/coins',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify({email:myUser.email, phone:myUser.phone, coins:coins, momo_number:momo, momo_name:myUser.business||''})
 });
 const d = await res.json();
 document.getElementById('msg').innerText = d.message;
 if(d.success){ loadBalance(); alert(d.message); }
 else alert(d.message);
}

loadBalance();
</script>
</body>
</html>
