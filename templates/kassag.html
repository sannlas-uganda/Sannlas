<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KASSAG - Private Savings Group</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
body{background:#0a0a0a;color:#fff;font-family:Inter, sans-serif}
.card{background:#18181b;border:1px solid #27272a;border-radius:18px}
.gold{color:#FFCC02}
.gold-bg{background:#FFCC02;color:#000}
.hidden-link{opacity:0.03;font-size:10px}
</style>
</head>
<body class="pb-24">
<!-- PRIVATE BANNER -->
<div class="bg-yellow-500 text-black text-center py-2 text-xs font-bold">🔒 PRIVATE GROUP - KASSAG - MEMBERS ONLY</div>

<div class="max-w-4xl mx-auto p-4">
  <!-- HEADER -->
  <div class="flex justify-between items-center py-4">
    <h1 class="text-2xl font-black">🏦 <span id="gName">KASSAG</span></h1>
    <div class="flex gap-2">
      <button onclick="showLogin()" class="border border-gray-700 px-4 py-2 rounded-full text-sm">Login</button>
      <button onclick="showJoin()" class="gold-bg px-5 py-2 rounded-full font-bold text-sm">Join</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="grid grid-cols-3 gap-3 my-4">
    <div class="card p-4 text-center"><div class="text-2xl font-black gold" id="sMembers">0</div><div class="text-xs text-gray-400">Active Members</div></div>
    <div class="card p-4 text-center"><div class="text-2xl font-black gold" id="sPot">0</div><div class="text-xs text-gray-400">Total Pot UGX</div></div>
    <div class="card p-4 text-center"><div class="text-2xl font-black gold" id="sPending">0</div><div class="text-xs text-gray-400">Pending</div></div>
  </div>

  <!-- TABS -->
  <div class="flex gap-2 my-4 overflow-x-auto">
    <button onclick="tab('members')" id="tabMembers" class="gold-bg px-4 py-2 rounded-full text-sm font-bold">👥 Members</button>
    <button onclick="tab('savings')" class="card px-4 py-2 rounded-full text-sm">💰 My Savings</button>
    <button onclick="tab('about')" class="card px-4 py-2 rounded-full text-sm">📜 Rules</button>
  </div>

  <!-- MEMBERS GRID -->
  <div id="secMembers" class="grid grid-cols-2 md:grid-cols-4 gap-3">
    <!-- loaded by JS -->
  </div>

  <!-- MY SAVINGS -->
  <div id="secSavings" class="hidden">
    <div class="card p-5">
      <h3 class="font-bold mb-3">Submit Weekly Savings</h3>
      <input id="myPhone" placeholder="Your phone 07..." class="w-full bg-black border border-gray-800 p-3 rounded-xl mb-2">
      <input id="myAmount" type="number" placeholder="Amount UGX" class="w-full bg-black border border-gray-800 p-3 rounded-xl mb-2">
      <input id="myWeek" placeholder="Week - e.g. Week 42" class="w-full bg-black border border-gray-800 p-3 rounded-xl mb-2">
      <label class="text-xs text-gray-400">Screenshot proof (MoMo)</label>
      <input id="myProof" type="file" accept="image/*" class="w-full mb-3 text-sm">
      <button onclick="submitSaving()" class="w-full gold-bg py-3 rounded-xl font-black">Submit Proof ✅</button>
      <div id="myHistory" class="mt-4"></div>
    </div>
  </div>

  <!-- ABOUT -->
  <div id="secAbout" class="hidden space-y-3">
    <div class="card p-5"><h4 class="gold font-bold">🎯 Goals</h4><p id="gGoals" class="text-sm text-gray-300 mt-1"></p></div>
    <div class="card p-5"><h4 class="gold font-bold">👁️ Vision</h4><p id="gVision" class="text-sm text-gray-300 mt-1"></p></div>
    <div class="card p-5"><h4 class="gold font-bold">🚀 Mission</h4><p id="gMission" class="text-sm text-gray-300 mt-1"></p></div>
    <div class="card p-5"><h4 class="gold font-bold">📜 Terms</h4><p id="gTerms" class="text-sm text-gray-300 mt-1 whitespace-pre-line"></p></div>
    <div class="card p-5"><h4 class="gold font-bold">🔐 Privacy</h4><p id="gPrivacy" class="text-sm text-gray-300 mt-1"></p></div>
  </div>

  <div class="hidden-link">sannlas private kassag</div>
</div>

<!-- JOIN MODAL -->
<div id="joinModal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center p-4 z-50">
  <div class="card p-6 w-full max-w-sm">
    <h3 class="font-black text-lg mb-3">Join KASSAG</h3>
    <input id="jName" placeholder="Full Name" class="w-full bg-black border border-gray-800 p-3 rounded-xl mb-2">
    <input id="jPhone" placeholder="Phone 07..." class="w-full bg-black border border-gray-800 p-3 rounded-xl mb-2">
    <select id="jRole" class="w-full bg-black border border-gray-800 p-3 rounded-xl mb-2"><option>Member</option><option>Leader</option><option>Treasurer</option><option>Secretary</option></select>
    <label class="text-xs text-gray-400">Your Photo</label>
    <input id="jPhoto" type="file" accept="image/*" class="w-full mb-3 text-sm">
    <div class="flex gap-2"><button onclick="closeJoin()" class="flex-1 card py-3 rounded-xl">Cancel</button><button onclick="doJoin()" class="flex-1 gold-bg py-3 rounded-xl font-bold">Request Join</button></div>
    <div id="jMsg" class="text-xs mt-2"></div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center p-4 z-50">
  <div class="card p-6 w-full max-w-sm">
    <h3 class="font-black">Member Login</h3><p class="text-xs text-gray-400 mb-3">Enter phone to view your savings</p>
    <input id="lPhone" placeholder="07..." class="w-full bg-black border border-gray-800 p-3 rounded-xl mb-3">
    <button onclick="doLogin()" class="w-full gold-bg py-3 rounded-xl font-bold">Login</button>
    <button onclick="closeLogin()" class="w-full mt-2 text-sm text-gray-400">Close</button>
    <div id="lMsg" class="text-xs mt-2"></div>
  </div>
</div>

<script>
let myPhoneStored = localStorage.getItem('kassag_phone')||'';
if(myPhoneStored) document.getElementById('myPhone').value=myPhoneStored;

function showJoin(){document.getElementById('joinModal').classList.remove('hidden')}
function closeJoin(){document.getElementById('joinModal').classList.add('hidden')}
function showLogin(){document.getElementById('loginModal').classList.remove('hidden')}
function closeLogin(){document.getElementById('loginModal').classList.add('hidden')}

function tab(t){
  document.getElementById('secMembers').classList.add('hidden');
  document.getElementById('secSavings').classList.add('hidden');
  document.getElementById('secAbout').classList.add('hidden');
  if(t=='members') document.getElementById('secMembers').classList.remove('hidden');
  if(t=='savings') document.getElementById('secSavings').classList.remove('hidden');
  if(t=='about') document.getElementById('secAbout').classList.remove('hidden');
}

async function loadInfo(){
  const r=await fetch('/api/kassag/admin/info'); if(!r.ok){ const rr=await fetch('/api/kassag/stats'); const s=await rr.json(); updateStats(s); return; }
  const d=await fetch('/api/kassag/stats').then(r=>r.json()); updateStats(d);
  try{
    const infoRes = await fetch('/kassag').then(r=>r.text());
  }catch{}
  // Load from /kassag page data via API
  fetch('/api/kassag/stats').then(r=>r.json()).then(s=>updateStats(s));
}

async function loadMembers(){
  try{
    const res = await fetch('/kassag'); // html render will have data but we fetch via stats
  }catch{}
  // We load via injecting from server template - fallback fetch members from page
  // Direct API is admin only, so we scrape from DOM if rendered, else we use public endpoint via stats page
  // For now fetch via hidden api
  const stats = await fetch('/api/kassag/stats').then(r=>r.json());
  // members are rendered server side, but we also try to get them via public page parsing
  // Instead, request home html and parse? Simpler: we load members via fetch to /kassag with JSON? We added template vars.
  // Let's fetch members via custom endpoint that returns public members
  // Temporary: call /api/kassag/admin/members may fail for guest, so we rely on server rendered
}

function updateStats(s){
  document.getElementById('sMembers').innerText=s.total_members||0;
  document.getElementById('sPot').innerText=(s.total_pot||0).toLocaleString();
  document.getElementById('sPending').innerText=(s.pending_members||0)+(s.pending_payments||0);
}

async function doJoin(){
  const fd = new FormData();
  fd.append('name', document.getElementById('jName').value);
  fd.append('phone', document.getElementById('jPhone').value);
  fd.append('role', document.getElementById('jRole').value);
  const photo = document.getElementById('jPhoto').files[0];
  if(photo) fd.append('photo', photo);
  document.getElementById('jMsg').innerText='Sending...';
  const r = await fetch('/api/kassag/join',{method:'POST',body:fd});
  const j = await r.json();
  document.getElementById('jMsg').innerText=j.message||JSON.stringify(j);
  if(j.success) setTimeout(closeJoin,1500);
}

async function doLogin(){
  const phone=document.getElementById('lPhone').value;
  const r=await fetch('/api/kassag/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
  const j=await r.json();
  document.getElementById('lMsg').innerText=j.message||'';
  if(j.success){
    localStorage.setItem('kassag_phone',phone);
    document.getElementById('myPhone').value=phone;
    closeLogin();
    tab('savings');
    loadMyHistory();
  }
}

async function submitSaving(){
  const fd=new FormData();
  fd.append('phone', document.getElementById('myPhone').value);
  fd.append('amount', document.getElementById('myAmount').value);
  fd.append('week', document.getElementById('myWeek').value);
  const f=document.getElementById('myProof').files[0];
  if(f) fd.append('screenshot', f);
  const r=await fetch('/api/kassag/savings/submit',{method:'POST',body:fd});
  const j=await r.json();
  alert(j.message||'Submitted!');
  if(j.success) loadMyHistory();
}

async function loadMyHistory(){
  const phone=document.getElementById('myPhone').value || myPhoneStored;
  if(!phone) return;
  const r=await fetch('/api/kassag/my-history?phone='+phone);
  const j=await r.json();
  let html=`<div class="mt-3 font-bold">Total Approved: UGX ${j.total.toLocaleString()}</div>`;
  html+= j.payments.map(p=>`<div class="card p-3 mt-2 flex justify-between"><div><div class="font-bold">${p.week} - UGX ${p.amount}</div><div class="text-xs text-gray-400">${p.status}</div></div><div class="text-xs">${new Date(p.date).toLocaleDateString()}</div></div>`).join('');
  document.getElementById('myHistory').innerHTML=html;
}

loadInfo(); loadMyHistory();
// Auto fill info from server rendered vars if available
try{
  const infoData = document.getElementById('serverInfo');
}catch{}
</script>

<!-- Server side data injection -->
<script id="serverData">
  // This will be replaced by Jinja if you add vars
</script>
{% if info %}
<script>
document.getElementById('gName').innerText="{{ info.name }}";
document.getElementById('gGoals').innerText=`{{ info.goals }}`;
document.getElementById('gVision').innerText=`{{ info.vision }}`;
document.getElementById('gMission').innerText=`{{ info.mission }}`;
document.getElementById('gTerms').innerText=`{{ info.terms }}`;
document.getElementById('gPrivacy').innerText=`{{ info.privacy }}`;
document.getElementById('secMembers').innerHTML = `
{% for m in members %}
<div class="card p-3 text-center">
  <img src="{{ m.photo or 'https://via.placeholder.com/100' }}" class="w-16 h-16 rounded-full mx-auto object-cover">
  <div class="font-bold mt-2 text-sm">{{ m.name }}</div>
  <div class="text-xs gold">{{ m.role }}</div>
  <div class="text-xs text-gray-500">{{ m.phone[:4] }}***{{ m.phone[-2:] }}</div>
</div>
{% endfor %}
`;
</script>
{% endif %}
</body>
</html>
