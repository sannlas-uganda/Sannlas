<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELL - SANNLAS Marketplace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#c0392b;padding-bottom:80px}
.navbar{background:#000;color:#fff;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:12}
.btn{background:#000;color:#FFCC02;border:2px solid #FFCC02;padding:10px;border-radius:20px;font-weight:bold;cursor:pointer;width:100%}
.btn-yellow{background:#FFCC02;color:#000}
.search-bar{background:#111;padding:10px;display:flex;gap:6px;position:sticky;top:50px;z-index:11}
.search-bar input,.search-bar select{padding:10px;border-radius:20px;border:none;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:8px}
.sell-form{background:#fff;border-radius:12px;padding:15px;margin:10px;border:3px solid #FFCC02}
.sell-form input,.sell-form textarea,.sell-form select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="navbar">
<div><a href="/" style="color:#FFCC02;text-decoration:none;font-weight:bold">🛍️ SANNLAS</a> | 🛒 SELL</div>
<div><button onclick="showView('list')" style="background:#FFCC02;border:none;padding:6px 10px;border-radius:10px;font-weight:bold">Shop</button> <button onclick="showView('form')" style="background:#00FF00;border:none;padding:6px 10px;border-radius:10px;font-weight:bold">+ Sell Item</button></div>
</div>

<div id="listView">
<div class="search-bar">
<input id="q" placeholder="Search products..." oninput="loadProducts()">
<select id="cat" onchange="loadProducts()"><option value="">All Categories</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Vehicles</option></select>
<select id="sort" onchange="loadProducts()"><option value="newest">Newest</option><option value="price_low">Low Price</option><option value="price_high">High Price</option></select>
</div>
<div style="background:#000;color:#FFCC02;padding:8px;text-align:center;font-weight:bold">🛒 MARKETPLACE - <span id="totalProducts">0</span> products</div>
<div id="productsGrid" class="grid"><p style="color:white;text-align:center;grid-column:1/-1;padding:30px">⏳ Loading...</p></div>
</div>

<div id="formView" class="hidden">
<div class="sell-form">
<h2 style="text-align:center">📦 Sell Product (FREE)</h2>
<input id="pName" placeholder="Product Name e.g. iPhone 13">
<textarea id="pDesc" placeholder="Description..." rows="3"></textarea>
<input id="pPrice" type="number" placeholder="Price UGX (e.g. 25000)">
<div style="background:#FFF9C4;border:2px solid #FFCC02;border-radius:10px;padding:10px;margin:6px 0">
  <label style="font-weight:900;font-size:12px">💰 PROMO COMMISSION - Pay Promoters per sale (Coins):</label>
  <select id="pPromoCoins" style="width:100%;padding:12px;border-radius:10px;border:2px solid #FFCC02;font-weight:bold;margin-top:5px">
    <option value="3">3 Coins = UGX 1,797 per sale (RECOMMENDED)</option>
    <option value="5">5 Coins = UGX 2,995 per sale (More promoters!)</option>
    <option value="10">10 Coins = UGX 5,990 per sale (Viral!)</option>
    <option value="15">15 Coins = UGX 8,985 per sale (Super Viral!)</option>
  </select>
  <small style="color:#666">Promoters earn this when they sell your product via reels! More coins = more promoters share!</small>
</div>
<input id="pQty" type="number" value="1" placeholder="Quantity">
<select id="pCategory"><option>Electronics</option><option>Fashion</option><option>Home & Living</option><option>Vehicles</option><option>Property</option><option>Other</option></select>
<input id="pLocation" placeholder="Location e.g. Kampala">
<input id="pImage" type="file" accept="image/*"><br><br>
<button class="btn btn-yellow" onclick="createProduct()">🚀 Post Product</button>
<p id="status" style="text-align:center;margin-top:8px;font-weight:bold"></p>
</div>
</div>

<div id="detailView" class="hidden">
<div style="background:#000;padding:8px"><a href="javascript:showView('list')" style="color:#FFCC02;text-decoration:none">← Back</a></div>
<div id="productBox" style="background:#fff;border-radius:12px;margin:10px;overflow:hidden">Loading...</div>
</div>

<script>
let currentUser=JSON.parse(localStorage.getItem('sannlas_user')||'{}');
function showView(v){document.getElementById('listView').classList.toggle('hidden',v!=='list');document.getElementById('formView').classList.toggle('hidden',v!=='form');document.getElementById('detailView').classList.toggle('hidden',v!=='detail');if(v=='list')loadProducts();}
let parts=location.pathname.split('/').filter(Boolean);
if(parts[0]=='sell' && parts[1]){ loadDetail(parts[1]); } else { showView('list'); }
async function loadProducts(){let q=document.getElementById('q').value;let cat=document.getElementById('cat').value;let sort=document.getElementById('sort').value;let url=`/api/products?q=${encodeURIComponent(q)}&category=${encodeURIComponent(cat)}&sort=${sort}`;try{let r=await fetch(url);let prods=await r.json();if(!Array.isArray(prods))prods=[];if(sort=='price_low')prods.sort((a,b)=>(a.price||0)-(b.price||0));else if(sort=='price_high')prods.sort((a,b)=>(b.price||0)-(a.price||0));else prods.sort((a,b)=>(b.created||0)-(a.created||0));document.getElementById('totalProducts').innerText=prods.length;if(prods.length==0){document.getElementById('productsGrid').innerHTML='<p style="color:white;grid-column:1/-1;text-align:center">No products - be first!</p>';return;}document.getElementById('productsGrid').innerHTML=prods.map(p=>`<div class="card" onclick="location.href='/sell/${p.id}'"><img src="${p.image||'https://via.placeholder.com/200'}"><div class="card-body"><b>${(p.name||'').slice(0,25)}</b><br><small>${p.location||''}</small><br><b style="color:#c0392b">UGX ${Number(p.price||0).toLocaleString()}</b></div></div>`).join('');}catch(e){document.getElementById('productsGrid').innerHTML='Error: '+e.message;}}
async function loadDetail(id){showView('detail');let r=await fetch(`/api/products/${id}`);let p=await r.json();if(!p.id){document.getElementById('productBox').innerHTML='Not found';return;}document.getElementById('productBox').innerHTML=`<img src="${p.image||''}" style="width:100%;height:300px;object-fit:cover"><div style="padding:15px"><h2>${p.name}</h2><p>${p.description||''}</p><h3>UGX ${Number(p.price||0).toLocaleString()}</h3><p>📍 ${p.location} | 📦 ${p.quantity}</p><button class="btn btn-yellow" onclick="window.open('https://wa.me/${(p.phone||'').replace(/[^0-9]/g,'')}')">📞 Contact Seller ${p.phone||''}</button></div>`;}
async function createProduct(){let name=document.getElementById('pName').value;let price=document.getElementById('pPrice').value;if(!name||!price){alert('Name & Price required!');return;}if(!currentUser.phone){alert('Login first!');return;}document.getElementById('status').innerText='Uploading...';let fd=new FormData();fd.append('name',name);fd.append('description',document.getElementById('pDesc').value);fd.append('price',price);fd.append('quantity',document.getElementById('pQty').value);fd.append('category',document.getElementById('pCategory').value);fd.append('location',document.getElementById('pLocation').value);fd.append('phone',currentUser.phone);fd.append('email',currentUser.email);let file=document.getElementById('pImage').files[0];if(file)fd.append('images',file);let r=await fetch('/api/products/create',{method:'POST',body:fd});let d=await r.json();document.getElementById('status').innerText=d.message;if(d.success)location.href='/sell/'+d.product.id;}
loadProducts();
</script>
</body>
</html>
