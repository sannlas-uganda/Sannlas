<!DOCTYPE html>
<html>
<head>
<title>Sannlas Admin - Private</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;padding:20px;background:#0f0f0f;color:white;margin:0}
.card{background:#1e1e1e;padding:15px;margin:12px 0;border-radius:10px;border:1px solid #333}
h1{color:#ff3333;text-align:center}
input, select{padding:12px;width:95%;border-radius:8px;border:none;margin:8px 0;background:#2a2a2a;color:white;font-size:16px}
button{padding:12px 20px;background:#ff0000;color:white;border:none;border-radius:8px;font-weight:bold;width:100%;font-size:16px;margin-top:8px;cursor:pointer}
.stat{display:inline-block;margin:6px;padding:12px;background:#222;border:1px solid #333;border-radius:8px;min-width:100px;text-align:center}
table{width:100%;border-collapse:collapse;color:white}th,td{border:1px solid #333;padding:8px;text-align:left;font-size:14px}th{background:#ff0000}
#adminContent{display:none}
#loginBox{max-width:350px;margin:80px auto;background:#1e1e1e;padding:25px;border-radius:12px;text-align:center;border:1px solid #ff0000}
.search-box{background:#111;padding:12px;border-radius:8px;border:1px solid #444;margin:10px 0}
.cat-item{padding:8px;background:#2a2a2a;margin:4px 0;border-radius:6px;cursor:pointer}
.cat-item:hover{background:#333}
.sub{color:#ff9999;font-size:13px;margin-left:10px}
</style>
</head>
<body>

<div id="loginBox">
<h1> SANNLAS ADMIN</h1>
<p>Private - Owner Only</p>
<input type="password" id="pass" placeholder="Enter Admin Password">
<button onclick="login()">Unlock Dashboard</button>
<p id="msg" style="color:#ff6666"></p>
<a href="/" style="color:#aaa;font-size:13px">← Back to Shop</a>
</div>

<div id="adminContent">
<h1>SANNLAS UGANDA - ADMIN</h1>
<a href="/" style="color:#ff6666">← Back to Shop</a> | <a href="#" onclick="logout()" style="color:#aaa">Logout</a>
<div id="stats"></div>

<div class="card" style="border:1px solid #ff0000">
<h2>📂 Business Categories - Smart Search (No Scrolling)</h2>
<div class="search-box">
<input type="text" id="catSearch" placeholder="🔍 Type to search category e.g. Fish, Shoes, Solar..." onkeyup="filterCats()">
<div style="display:flex;gap:8px">
<select id="mainCat" onchange="loadSub()"><option value="">Select Main Category</option></select>
<select id="subCat"><option value="">Select Subcategory</option></select>
</div>
<p style="font-size:12px;color:#aaa">Buyer flow: Choose Main → Sub auto-loads. No scrolling needed.</p>
</div>
<div id="catList" style="max-height:300px;overflow-y:auto;background:#111;padding:10px;border-radius:8px"></div>
</div>

<div class="card"><h2>Sellers</h2><div id="sellers">Loading...</div></div>
<div class="card"><h2>Orders</h2><div id="orders">Loading...</div></div>
<div class="card"><h2>Products</h2><div id="products">Loading...</div></div>
<div class="card"><h2>Revenue</h2><div id="revenue"></div></div>
</div>

<script>
const MY_PASSWORD = "ThE,RISE";
const BUSINESS_CATEGORIES = {
"Agriculture & Farming":["Crop Farming","Livestock Farming","Poultry Farming","Dairy Farming","Fish Farming","Beekeeping","Horticulture","Floriculture","Farm Machinery","Seeds & Fertilizers","Animal Feeds"],
"Food & Beverages":["Restaurants","Fast Food","Cafes","Bakeries","Butcheries","Supermarkets","Grocery Stores","Catering","Food Delivery","Beverages","Food Processing","Fresh Foods"],
"Construction & Building":["Cement","Bricks & Blocks","Sand & Aggregates","Roofing Materials","Steel & Metal","Plumbing Materials","Electrical Materials","Paints","Tiles","Doors & Windows","Building Tools","Construction Machinery","Road Construction","Interior Finishing","Landscaping"],
"Real Estate":["Land","Houses","Apartments","Offices","Shops","Warehouses","Rental Properties","Commercial Buildings","Property Management","Real Estate Agencies"],
"Fashion & Clothing":["Men's Clothing","Women's Clothing","Children's Clothing","Suits","Dresses","Shirts","Trousers","Shoes","Bags","Sportswear","Underwear","Jewelry","Watches","Fashion Accessories"],
"Electronics & Technology":["Mobile Phones","Laptops","Desktop Computers","Tablets","Televisions","Cameras","Speakers","Headphones","Computer Accessories","Phone Accessories","Printers","Gaming Devices","Smart Devices","Home Appliances"],
"Automotive":["Cars","Motorcycles","Trucks","Buses","Car Parts","Motorcycle Parts","Tires","Batteries","Car Accessories","Car Repair","Car Washing","Car Rental","Vehicle Insurance"],
"Health & Medical":["Hospitals","Clinics","Pharmacies","Medical Equipment","Medical Supplies","Laboratories","Dental Services","Optical Services","Nursing Services","Home Healthcare"],
"Beauty & Personal Care":["Cosmetics","Skincare","Hair Products","Hair Salons","Barbershops","Makeup","Perfumes","Nail Care","Spa Services","Beauty Equipment"],
"Education":["Schools","Universities","Vocational Training","Online Courses","Tutoring","Books","Stationery","Educational Software","Training Centers","Educational Consultancy"],
"Financial Services":["Banking","Insurance","Loans","Microfinance","Accounting","Auditing","Investment","Tax Services","Financial Consultancy","Payment Services"],
"Transport & Logistics":["Taxi Services","Bus Services","Trucking","Motorcycle Transport","Courier Services","Delivery Services","Freight Forwarding","Warehousing","Shipping","Moving Services"],
"Travel & Tourism":["Hotels","Lodges","Resorts","Travel Agencies","Tour Operators","Safari Services","Car Hire","Tourist Attractions","Travel Booking","Airlines"],
"Entertainment & Media":["Music","Movies","Photography","Videography","Gaming","DJs","Event Management","Radio","Television","Publishing","Streaming"],
"Sports & Fitness":["Gyms","Fitness Training","Sports Equipment","Sportswear","Football","Basketball","Swimming","Martial Arts","Sports Clubs","Fitness Centers"],
"Home & Furniture":["Sofas","Beds","Tables","Chairs","Cabinets","Mattresses","Curtains","Carpets","Kitchen Equipment","Home Decorations","Household Products"],
"Energy & Utilities":["Solar Energy","Solar Panels","Batteries","Generators","Electrical Equipment","Gas","Water Supply","Renewable Energy","Energy Services"],
"Manufacturing":["Textile Manufacturing","Food Manufacturing","Furniture Manufacturing","Metal Fabrication","Plastic Products","Chemical Products","Paper Products","Machinery","Industrial Equipment","Packaging"],
"Professional Services":["Lawyers","Accountants","Engineers","Architects","Surveyors","Consultants","Marketing Agencies","Advertising Agencies","HR Services","Business Consultancy"],
"Information Technology":["Website Development","Mobile App Development","Software Development","Cybersecurity","Cloud Services","Data Services","Artificial Intelligence","Computer Repair","Networking","Digital Marketing"],
"Telecommunications":["Mobile Networks","Internet Services","Fiber Internet","Broadband","SIM Cards","Communication Equipment","Telecommunication Services"],
"Home & Property Services":["Cleaning","Plumbing","Electrical Services","Painting","Carpentry","Masonry","Roofing","Gardening","Pest Control","Security Services"],
"Security Services":["Security Guards","CCTV Systems","Alarm Systems","Access Control","Security Equipment","Security Consultancy","Private Investigation"],
"Pets & Animals":["Pet Food","Pet Accessories","Veterinary Services","Pet Grooming","Pet Shops","Animal Breeding","Animal Equipment"],
"Events & Weddings":["Wedding Planning","Event Decoration","Catering","Photography","Videography","Wedding Dresses","Event Venues","Entertainment","Event Equipment"],
"Printing & Stationery":["Printing","Graphic Design","Business Cards","Posters","Books","Stationery","Branding","Sign Making","Packaging"],
"Repair & Maintenance Services":["Phone Repair","Computer Repair","Appliance Repair","Vehicle Repair","Electrical Repair","Plumbing Repair","Machinery Repair","Furniture Repair"],
"Business & Consulting Services":["Business Consulting","Management Consulting","Marketing Consulting","Financial Consulting","IT Consulting","Human Resources","Business Registration","Entrepreneurship Services"]
};

function initCats(){
 let main = document.getElementById('mainCat');
 Object.keys(BUSINESS_CATEGORIES).forEach(c=>{
   let o=document.createElement('option');o.value=c;o.innerText=c;main.appendChild(o);
 });
 renderCats(BUSINESS_CATEGORIES);
}
function loadSub(){
 let m=document.getElementById('mainCat').value;
 let s=document.getElementById('subCat');s.innerHTML='<option value="">Select Subcategory</option>';
 if(BUSINESS_CATEGORIES[m]){BUSINESS_CATEGORIES[m].forEach(sub=>{let o=document.createElement('option');o.value=sub;o.innerText=sub;s.appendChild(o);});}
}
function renderCats(data){
 let html='';
 Object.entries(data).forEach(([main, subs])=>{
   html+=`<div class="cat-item"><b>${main}</b><div class="sub">${subs.join(' • ')}</div></div>`;
 });
 document.getElementById('catList').innerHTML=html||'No match';
}
function filterCats(){
 let q=document.getElementById('catSearch').value.toLowerCase();
 if(!q){renderCats(BUSINESS_CATEGORIES);return;}
 let filtered={};
 Object.entries(BUSINESS_CATEGORIES).forEach(([main, subs])=>{
   if(main.toLowerCase().includes(q)){filtered[main]=subs;}
   else {
     let matchSubs=subs.filter(s=>s.toLowerCase().includes(q));
     if(matchSubs.length>0) filtered[main]=matchSubs;
   }
 });
 renderCats(filtered);
}

function login(){let p=document.getElementById('pass').value;if(p===MY_PASSWORD){localStorage.setItem('sannlas_admin','ok');showAdmin();}else{document.getElementById('msg').innerText="Wrong password!";}}
function showAdmin(){document.getElementById('loginBox').style.display='none';document.getElementById('adminContent').style.display='block';initCats();loadData();}
function logout(){localStorage.removeItem('sannlas_admin');location.reload();}
function loadData(){fetch('/api/admin/data').then(r=>r.json()).then(d=>{document.getElementById('stats').innerHTML=`<div class="stat">Revenue<br><b>UGX ${d.total_revenue||0}</b></div><div class="stat">Sellers<br><b>${d.total_sellers||0}</b></div><div class="stat">Orders<br><b>${d.total_orders||0}</b></div><div class="stat">Products<br><b>${d.products?.length||0}</b></div>`;document.getElementById('sellers').innerHTML='<table><tr><th>Business</th><th>Phone</th><th>Plan</th><th>Expiry</th></tr>'+ (d.sellers||[]).map(s=>`<tr><td>${s.business}</td><td>${s.phone}</td><td>${s.plan}</td><td>${s.expiry}</td></tr>`).join('')+'</table>';document.getElementById('orders').innerHTML='<table><tr><th>Buyer</th><th>District</th><th>Date</th></tr>'+ (d.orders||[]).map(o=>`<tr><td>${o.buyer}</td><td>${o.district}</td><td>${o.date}</td></tr>`).join('')+'</table>';document.getElementById('products').innerHTML=(d.products||[]).map(p=>`${p.name} - UGX ${p.price}`).join('<br>') || 'No products';document.getElementById('revenue').innerText="Total: UGX "+(d.total_revenue||0);}).catch(e=>{document.getElementById('sellers').innerText='Error: '+e});}
if(localStorage.getItem('sannlas_admin')==='ok'){showAdmin();}
</script>
</body>
</html>
