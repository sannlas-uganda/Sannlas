<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>@{{shop_slug}} - SANNLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.header{padding:20px 15px 10px;display:flex;gap:15px;border-bottom:1px solid #222;align-items:flex-start}
.avatar{width:80px;height:80px;background:linear-gradient(135deg,#FFCC02,#FF9900);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:32px;flex-shrink:0;border:3px solid #222}
.info{flex:1}
.info h2{font-size:20px;font-weight:900;margin-bottom:2px}
.info p{font-size:13px;opacity:0.6;margin-bottom:12px}
.stats{display:flex;gap:20px}
.stat{text-align:center}
.stat b{display:block;font-size:18px;font-weight:900}
.stat span{font-size:11px;opacity:0.6;text-transform:uppercase;letter-spacing:0.5px}
.actions{display:flex;gap:10px;padding:15px}
.btn{flex:1;padding:12px;text-align:center;border-radius:25px;font-weight:900;font-size:14px;text-decoration:none;display:block;cursor:pointer}
.btn-yellow{background:#FFCC02;color:#000;border:3px solid #000}
.btn-outline{background:transparent;color:#fff;border:1px solid #333}
.tabs{display:flex;border-bottom:1px solid #222;margin-top:5px}
.tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:700;opacity:0.5;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{opacity:1;border-bottom-color:#FFCC02;color:#FFCC02}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#111}
.grid-item{position:relative;height:185px;background:#0a0a0a;overflow:hidden;display:block;text-decoration:none}
.grid-item video{width:100%;height:100%;object-fit:cover}
.grid-item .overlay{position:absolute;bottom:0;left:0;right:0;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,0.8));display:flex;justify-content:space-between;align-items:center}
.grid-item .likes{font-size:11px;color:#fff;font-weight:600}
.grid-item .coins{font-size:10px;background:#FFCC02;color:#000;padding:2px 6px;border-radius:10px;font-weight:900}
.empty{padding:60px 20px;text-align:center;opacity:0.5}
.empty b{display:block;font-size:40px;margin-bottom:10px}
.back{position:fixed;top:15px;left:15px;background:rgba(0,0,0,0.6);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-size:18px;z-index:10;backdrop-filter:blur(10px)}
</style>
</head>
<body>

<a href="/reels" class="back">←</a>

<div class="header">
  <div class="avatar" id="avatarLetter">{{shop_slug[0]|upper}}</div>
  <div class="info">
    <h2>@{{shop_slug}}</h2>
    <p id="shopName">SANNLAS Creator • Uganda</p>
    <div class="stats">
      <div class="stat"><b id="count">0</b><span>Reels</span></div>
      <div class="stat"><b id="totalLikes">0</b><span>Likes</span></div>
      <div class="stat"><b id="totalEarn">0</b><span>UGX Earnable</span></div>
    </div>
  </div>
</div>

<div class="actions">
  <a id="shopLink" class="btn btn-yellow" href="/shop/{{shop_slug}}">🏪 VISIT SHOP</a>
  <a class="btn btn-outline" href="/reels">🎬 Reels</a>
</div>

<div class="tabs">
  <div class="tab active">🎬 Reels</div>
  <div class="tab">❤️ Liked</div>
  <div class="tab">💰 Promo</div>
</div>

<div class="grid" id="grid">
  <div class="empty"><b>⏳</b>Loading reels...</div>
</div>

<script>
const slug = "{{shop_slug}}".toLowerCase();
document.getElementById('shopLink').href = "/shop/" + slug;

async function load(){
  try{
    const r = await fetch('/api/sannlas/reels/user/' + encodeURIComponent(slug));
    const reels = await r.json();
    
    document.getElementById('count').innerText = reels.length;
    const totalLikes = reels.reduce((a,b)=>a+(b.likes||0),0);
    document.getElementById('totalLikes').innerText = totalLikes;
    const totalEarn = reels.reduce((a,b)=>a+(b.earn_amount||0),0);
    document.getElementById('totalEarn').innerText = totalEarn.toLocaleString();
    
    if(reels.length > 0){
      document.getElementById('shopName').innerText = (reels[0].shop_name || slug) + " • Uganda";
      document.getElementById('avatarLetter').innerText = (reels[0].shop_name || slug)[0].toUpperCase();
    }

    const grid = document.getElementById('grid');
    if(reels.length === 0){
      grid.innerHTML = `<div class="empty" style="grid-column:1/4"><b>🎬</b>No reels yet<br><span style="font-size:12px">@${slug} hasn't posted</span></div>`;
      return;
    }

    grid.innerHTML = reels.map(reel=>`
      <a href="/reels?play=${reel.id}" class="grid-item">
        <video src="${reel.video_url}" muted playsinline preload="metadata"></video>
        <div class="overlay">
          <span class="likes">❤️ ${reel.likes||0}</span>
          <span class="coins">${reel.promo_coins||3}c</span>
        </div>
      </a>
    `).join('');
  }catch(e){
    document.getElementById('grid').innerHTML = `<div class="empty" style="grid-column:1/4">Failed to load<br>${e.message}</div>`;
  }
}
load();
</script>

</body>
</html>
